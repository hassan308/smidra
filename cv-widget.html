<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV - Smidra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      /* Nordic Editorial Palette */
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;

      --cream: #FDFBF7;
      --cream-dark: #F5F1EA;
      --charcoal: #2C2C2C;
      --charcoal-light: #4A4A4A;
      --accent: #C85A38;
      --accent-light: #E8D5CE;
      --sage: #7B9E87;
      --sage-light: #E8F0EA;
      --warm-gray: #8B8680;
      --border: #E8E4DE;

      /* Light Theme */
      --bg-primary: var(--cream);
      --bg-secondary: var(--cream-dark);
      --bg-elevated: #FFFFFF;
      --text-primary: var(--charcoal);
      --text-secondary: var(--charcoal-light);
      --text-tertiary: var(--warm-gray);

      /* Shadows */
      --shadow-sm: 0 1px 2px rgba(44, 44, 44, 0.04);
      --shadow-md: 0 4px 12px rgba(44, 44, 44, 0.06);
      --shadow-lg: 0 8px 24px rgba(44, 44, 44, 0.08);

      /* Border Radius */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;
    }

    /* Dark mode uses same colors as light mode */
    [data-theme="dark"] {
      /* Same as light mode */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.025;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Target job badge */
    .target-badge {
      background: var(--charcoal);
      color: var(--cream);
      padding: 18px 22px;
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow-md);
    }

    /* Dark mode same as light mode */

    .target-badge svg { width: 26px; height: 26px; flex-shrink: 0; }
    .target-badge-text { flex: 1; }
    .target-badge-label {
      font-size: 11px;
      opacity: 0.7;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .target-badge-job {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      margin-top: 3px;
    }

    /* CV Card */
    .cv-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    /* Header */
    .cv-header {
      background: var(--charcoal);
      color: var(--cream);
      padding: 36px 32px;
      text-align: center;
      position: relative;
    }

    /* Dark mode cv-header same as light mode */

    .cv-header-content { position: relative; z-index: 1; }

    .cv-name {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .cv-title {
      font-size: 17px;
      opacity: 0.85;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .cv-contact {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      font-size: 13px;
    }

    .cv-contact-item {
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.9;
      background: rgba(255,255,255,0.1);
      padding: 7px 14px;
      border-radius: 20px;
      transition: background 0.2s ease;
    }

    .cv-contact-item:hover { background: rgba(255,255,255,0.18); }
    .cv-contact-item svg { width: 15px; height: 15px; }
    .cv-contact-item a {
      color: inherit;
      text-decoration: none;
      font-weight: 500;
    }
    .cv-contact-item a:hover { text-decoration: underline; }

    /* Body */
    .cv-body { padding: 32px; }

    /* Summary */
    .cv-summary {
      font-size: 15px;
      line-height: 1.8;
      color: var(--text-secondary);
      padding: 20px;
      background: var(--sage-light);
      border-radius: var(--radius-lg);
      border-left: 3px solid var(--sage);
      margin-bottom: 28px;
    }

    /* Section */
    .cv-section { margin-bottom: 28px; }
    .cv-section:last-child { margin-bottom: 0; }

    .cv-section-title {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cv-section-title::before {
      content: '';
      width: 3px;
      height: 14px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* Experience */
    .cv-experience-item {
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .cv-experience-item:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .cv-experience-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cv-experience-title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .cv-experience-company {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .cv-experience-period {
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-secondary);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 500;
    }

    .cv-experience-desc {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .cv-experience-highlights { list-style: none; }

    .cv-experience-highlights li {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-secondary);
      padding-left: 20px;
      position: relative;
      margin-bottom: 6px;
    }

    .cv-experience-highlights li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
    }

    /* Skills */
    .cv-skills-group { margin-bottom: 16px; }
    .cv-skills-group:last-child { margin-bottom: 0; }

    .cv-skills-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cv-skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cv-skill-tag {
      background: var(--accent-light);
      color: var(--accent);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      transition: transform 0.2s ease;
    }

    .cv-skill-tag:hover { transform: translateY(-1px); }

    .cv-skill-tag.soft {
      background: var(--sage-light);
      color: var(--sage);
    }

    .cv-skill-tag.language {
      background: var(--cream-dark);
      color: var(--charcoal-light);
    }

    /* Education */
    .cv-education-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      padding: 16px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      flex-wrap: wrap;
      gap: 8px;
      transition: transform 0.2s ease;
    }

    .cv-education-item:hover { transform: translateY(-2px); }
    .cv-education-item:last-child { margin-bottom: 0; }

    .cv-education-degree {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .cv-education-school {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .cv-education-year {
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-elevated);
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 500;
    }

    /* Actions */
    .cv-actions {
      padding: 20px 32px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn svg { width: 17px; height: 17px; }

    .btn-primary {
      background: var(--charcoal);
      color: var(--cream);
    }

    .btn-primary:hover {
      background: var(--charcoal-light);
    }

    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--cream-dark);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Loading */
    .loading-state {
      text-align: center;
      padding: 60px 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    .loading-text {
      font-size: 14px;
      color: var(--text-secondary);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Print styles */
    @media print {
      body { background: white; }
      body::before { display: none; }
      .container { padding: 0; max-width: 100%; }
      .target-badge, .cv-actions { display: none; }
      .cv-card { box-shadow: none; border: none; }
    }

    /* Mobile */
    @media (max-width: 640px) {
      .container { padding: 12px; }
      .cv-header { padding: 28px 20px; }
      .cv-name { font-size: 26px; }
      .cv-title { font-size: 15px; }
      .cv-contact { flex-direction: column; gap: 8px; }
      .cv-contact-item { justify-content: center; }
      .cv-body { padding: 24px 20px; }
      .cv-actions { padding: 16px 20px; flex-direction: column; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Icons
    const EmailIcon = () => (
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
      </svg>
    );
    const PhoneIcon = () => (
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
      </svg>
    );
    const LocationIcon = () => (
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
    );
    const LinkedInIcon = () => (
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
      </svg>
    );
    const WebIcon = () => (
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
      </svg>
    );
    const TargetIcon = () => (
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
      </svg>
    );
    const DownloadIcon = () => (
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
      </svg>
    );
    const PrintIcon = () => (
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
      </svg>
    );

    const defaultLabels = {
      experience: 'Erfarenhet',
      skills: 'Kompetenser',
      education: 'Utbildning',
      technical: 'Tekniska',
      softSkills: 'Mjuka',
      languages: 'Sprak',
      download: 'Ladda ner PDF',
      print: 'Skriv ut',
      tailoredFor: 'Anpassat for'
    };

    const App = () => {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [downloading, setDownloading] = useState(false);

      useEffect(() => {
        if (window.openai?.theme) {
          document.documentElement.setAttribute('data-theme', window.openai.theme);
        }

        if (window.openai?.toolOutput) {
          setData(window.openai.toolOutput);
          setLoading(false);
        }

        const handleGlobals = (e) => {
          if (window.openai?.theme) {
            document.documentElement.setAttribute('data-theme', window.openai.theme);
          }
          if (e.detail?.globals?.toolOutput || window.openai?.toolOutput) {
            setData(e.detail?.globals?.toolOutput || window.openai.toolOutput);
            setLoading(false);
          }
        };
        window.addEventListener('openai:set_globals', handleGlobals);
        return () => window.removeEventListener('openai:set_globals', handleGlobals);
      }, []);

      useEffect(() => {
        window.openai?.notifyIntrinsicHeight?.(document.body.scrollHeight);
      }, [data, loading]);

      const handleDownload = async () => {
        setDownloading(true);
        try {
          const element = document.getElementById('cv-content');
          const opt = {
            margin: 10,
            filename: `CV_${data.cv.name.replace(/\s+/g, '_')}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
          };
          await html2pdf().set(opt).from(element).save();
        } catch (err) {
          alert('Kunde inte skapa PDF');
        }
        setDownloading(false);
      };

      const handlePrint = () => {
        window.print();
      };

      if (loading) {
        return (
          <div className="container">
            <div className="cv-card">
              <div className="loading-state">
                <div className="spinner"></div>
                <div className="loading-text">Förbereder ditt anpassade CV...</div>
              </div>
            </div>
          </div>
        );
      }

      if (!data || !data.cv) {
        return (
          <div className="container">
            <div className="cv-card">
              <div className="loading-state">
                <div className="loading-text">Ingen CV-data tillganglig</div>
              </div>
            </div>
          </div>
        );
      }

      const { cv, targetJob, labels: customLabels } = data;
      const labels = { ...defaultLabels, ...customLabels };

      return (
        <div className="container">
          {targetJob && (
            <div className="target-badge">
              <TargetIcon />
              <div className="target-badge-text">
                <div className="target-badge-label">{labels.tailoredFor}</div>
                <div className="target-badge-job">{targetJob.title} - {targetJob.company}</div>
              </div>
            </div>
          )}

          <div className="cv-card" id="cv-content">
            <div className="cv-header">
              <div className="cv-header-content">
                <div className="cv-name">{cv.name}</div>
                <div className="cv-title">{cv.title}</div>
                <div className="cv-contact">
                  {cv.email && (
                    <div className="cv-contact-item">
                      <EmailIcon />
                      <a href={`mailto:${cv.email}`}>{cv.email}</a>
                    </div>
                  )}
                  {cv.phone && (
                    <div className="cv-contact-item">
                      <PhoneIcon />
                      <span>{cv.phone}</span>
                    </div>
                  )}
                  {cv.location && (
                    <div className="cv-contact-item">
                      <LocationIcon />
                      <span>{cv.location}</span>
                    </div>
                  )}
                  {cv.linkedin && (
                    <div className="cv-contact-item">
                      <LinkedInIcon />
                      <a href={cv.linkedin} target="_blank" rel="noopener">LinkedIn</a>
                    </div>
                  )}
                  {cv.website && (
                    <div className="cv-contact-item">
                      <WebIcon />
                      <a href={cv.website} target="_blank" rel="noopener">Portfolio</a>
                    </div>
                  )}
                </div>
              </div>
            </div>

            <div className="cv-body">
              {cv.summary && (
                <div className="cv-summary">{cv.summary}</div>
              )}

              {cv.experience && cv.experience.length > 0 && (
                <div className="cv-section">
                  <div className="cv-section-title">{labels.experience}</div>
                  {cv.experience.map((exp, i) => (
                    <div key={i} className="cv-experience-item">
                      <div className="cv-experience-header">
                        <div>
                          <div className="cv-experience-title">{exp.title}</div>
                          <div className="cv-experience-company">{exp.company}</div>
                        </div>
                        <div className="cv-experience-period">{exp.period}</div>
                      </div>
                      {exp.description && (
                        <div className="cv-experience-desc">{exp.description}</div>
                      )}
                      {exp.highlights && exp.highlights.length > 0 && (
                        <ul className="cv-experience-highlights">
                          {exp.highlights.map((h, j) => (
                            <li key={j}>{h}</li>
                          ))}
                        </ul>
                      )}
                    </div>
                  ))}
                </div>
              )}

              {cv.skills && (
                <div className="cv-section">
                  <div className="cv-section-title">{labels.skills}</div>
                  {cv.skills.technical && cv.skills.technical.length > 0 && (
                    <div className="cv-skills-group">
                      <div className="cv-skills-label">{labels.technical}</div>
                      <div className="cv-skills-list">
                        {cv.skills.technical.map((s, i) => (
                          <span key={i} className="cv-skill-tag">{s}</span>
                        ))}
                      </div>
                    </div>
                  )}
                  {cv.skills.soft && cv.skills.soft.length > 0 && (
                    <div className="cv-skills-group">
                      <div className="cv-skills-label">{labels.softSkills}</div>
                      <div className="cv-skills-list">
                        {cv.skills.soft.map((s, i) => (
                          <span key={i} className="cv-skill-tag soft">{s}</span>
                        ))}
                      </div>
                    </div>
                  )}
                  {cv.skills.languages && cv.skills.languages.length > 0 && (
                    <div className="cv-skills-group">
                      <div className="cv-skills-label">{labels.languages}</div>
                      <div className="cv-skills-list">
                        {cv.skills.languages.map((s, i) => (
                          <span key={i} className="cv-skill-tag language">{s}</span>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {cv.education && cv.education.length > 0 && (
                <div className="cv-section">
                  <div className="cv-section-title">{labels.education}</div>
                  {cv.education.map((edu, i) => (
                    <div key={i} className="cv-education-item">
                      <div>
                        <div className="cv-education-degree">{edu.degree}</div>
                        <div className="cv-education-school">{edu.school}</div>
                      </div>
                      <div className="cv-education-year">{edu.year}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="cv-actions">
              <button className="btn btn-primary" onClick={handleDownload} disabled={downloading}>
                <DownloadIcon />
                {downloading ? 'Skapar PDF...' : labels.download}
              </button>
              <button className="btn btn-secondary" onClick={handlePrint}>
                <PrintIcon />
                {labels.print}
              </button>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
