<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smidra - Job Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;

      /* Warm, refined palette */
      --cream: #FDFBF7;
      --cream-dark: #F5F2ED;
      --sand: #E8E4DD;
      --stone: #C9C4BC;
      --charcoal: #2C2C2C;
      --charcoal-soft: #4A4A4A;
      --charcoal-muted: #7A7A7A;

      /* Accent - warm terracotta */
      --accent: #C85A38;
      --accent-hover: #B54E2E;
      --accent-soft: rgba(200, 90, 56, 0.08);
      --accent-glow: rgba(200, 90, 56, 0.15);

      /* Secondary - sage green */
      --sage: #7B9E87;
      --sage-soft: rgba(123, 158, 135, 0.1);

      /* Semantic */
      --success: #5B8C5A;
      --warning: #D4A03C;
      --urgent: #C44536;

      /* Surfaces */
      --surface-primary: var(--cream);
      --surface-elevated: #FFFFFF;
      --surface-sunken: var(--cream-dark);

      /* Text */
      --text-primary: var(--charcoal);
      --text-secondary: var(--charcoal-soft);
      --text-muted: var(--charcoal-muted);
      --text-inverse: #FFFFFF;

      /* Borders */
      --border: var(--sand);
      --border-subtle: rgba(0,0,0,0.06);

      /* Shadows - soft and warm */
      --shadow-xs: 0 1px 2px rgba(44,44,44,0.04);
      --shadow-sm: 0 2px 8px rgba(44,44,44,0.06);
      --shadow-md: 0 4px 20px rgba(44,44,44,0.08);
      --shadow-lg: 0 12px 40px rgba(44,44,44,0.12);
      --shadow-card: 0 2px 12px rgba(44,44,44,0.06);
      --shadow-card-hover: 0 8px 32px rgba(44,44,44,0.12);

      /* Radii */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;
      --radius-2xl: 28px;
      --radius-full: 9999px;

      /* Timing */
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Dark mode uses same colors as light mode */
    [data-theme="dark"] {
      /* Same as light mode */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--font-body);
      background: var(--surface-primary);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.6;
      letter-spacing: -0.01em;
    }

    /* Subtle grain texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 9999;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--stone); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--charcoal-muted); }

    .container { max-width: 1000px; margin: 0 auto; }

    /* Header - Editorial style */
    .header {
      padding: 40px 28px 32px;
      background: var(--surface-primary);
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 28px;
      right: 28px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }

    .header-eyebrow {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-eyebrow::before {
      content: '';
      width: 24px;
      height: 2px;
      background: var(--accent);
    }

    .header-title {
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .header-location {
      font-size: 15px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-location svg { width: 16px; height: 16px; color: var(--sage); }

    .header-count {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-count-num {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .header-loading {
      width: 14px; height: 14px;
      border: 2px solid var(--sand);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Controls - Pill style */
    .controls {
      display: flex;
      gap: 10px;
      padding: 20px 28px;
      background: var(--surface-primary);
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .control-btn {
      padding: 10px 20px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-full);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: all 0.25s var(--ease-out);
      background: var(--surface-elevated);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-btn:hover {
      border-color: var(--stone);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .control-btn.active {
      background: var(--charcoal);
      color: var(--text-inverse);
      border-color: var(--charcoal);
    }

    .control-btn.primary {
      background: var(--accent);
      color: var(--text-inverse);
      border-color: var(--accent);
    }

    .control-btn.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .control-btn svg { width: 16px; height: 16px; }

    /* Map Section */
    .map-section {
      margin: 0 28px 24px;
      border-radius: var(--radius-xl);
      overflow: hidden;
      background: var(--surface-elevated);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-subtle);
      transition: height 0.4s var(--ease-out), opacity 0.3s ease, margin 0.4s var(--ease-out);
    }

    .map-section.collapsed {
      height: 0 !important;
      opacity: 0;
      margin-bottom: 0;
      border: none;
    }

    .map-wrapper { height: 280px; position: relative; }
    #map { width: 100%; height: 100%; }

    .map-info {
      position: absolute;
      bottom: 16px; left: 16px;
      background: var(--surface-elevated);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      box-shadow: var(--shadow-md);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .map-info .dot {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
      box-shadow: 0 0 0 0 var(--accent-glow);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 var(--accent-glow); }
      50% { opacity: 0.8; transform: scale(1.1); box-shadow: 0 0 0 8px transparent; }
    }

    /* Job Grid - Masonry-inspired */
    .job-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding: 0 28px 28px;
    }

    /* Job Card - Editorial/Magazine style */
    .job-card {
      background: var(--surface-elevated);
      border-radius: var(--radius-xl);
      overflow: hidden;
      transition: all 0.35s var(--ease-out);
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      position: relative;
    }

    .job-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      transition: opacity 0.35s ease;
    }

    .job-card:hover {
      transform: translateY(-6px);
    }

    .job-card:hover::before {
      box-shadow: var(--shadow-card-hover);
    }

    .job-card-inner {
      position: relative;
      z-index: 1;
    }

    .job-card-header {
      padding: 24px 24px 20px;
    }

    .job-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .job-card-company {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .company-logo {
      width: 44px; height: 44px;
      border-radius: var(--radius-md);
      object-fit: cover;
      background: var(--surface-sunken);
    }

    .company-logo-fallback {
      width: 44px; height: 44px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--sage) 0%, var(--sage-soft) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-inverse);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    .company-info { flex: 1; min-width: 0; }

    .company-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .job-type-badge {
      display: inline-flex;
      font-size: 10px;
      color: var(--sage);
      background: var(--sage-soft);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .save-btn {
      width: 36px; height: 36px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--surface-sunken);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: var(--text-muted);
    }

    .save-btn:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .save-btn.saved {
      background: var(--accent);
      color: var(--text-inverse);
    }

    .save-btn svg { width: 16px; height: 16px; }

    .job-card-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.3;
      letter-spacing: -0.01em;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .job-card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .job-meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .job-meta-item svg { width: 14px; height: 14px; color: var(--stone); }

    .job-card-footer {
      display: flex;
      padding: 16px 24px;
      gap: 10px;
      background: var(--surface-sunken);
      border-top: 1px solid var(--border-subtle);
    }

    /* Buttons */
    .btn {
      flex: 1;
      padding: 12px 18px;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s var(--ease-out);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn svg { width: 15px; height: 15px; }

    .btn-primary {
      background: var(--charcoal);
      color: var(--text-inverse);
    }

    .btn-primary:hover {
      background: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .btn-secondary {
      background: var(--surface-elevated);
      color: var(--text-primary);
      border: 1.5px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--charcoal);
      transform: translateY(-1px);
    }

    /* Pagination - Minimal */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      padding: 32px 28px 40px;
    }

    .page-btn {
      min-width: 40px; height: 40px;
      border: none;
      border-radius: var(--radius-md);
      background: transparent;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .page-btn:hover:not(:disabled) {
      background: var(--surface-sunken);
      color: var(--text-primary);
    }

    .page-btn.active {
      background: var(--charcoal);
      color: var(--text-inverse);
    }

    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-dots { padding: 0 8px; color: var(--text-muted); font-size: 14px; }

    /* Empty & Loading States */
    .empty-state, .loading-state {
      padding: 80px 28px;
      text-align: center;
    }

    .empty-icon, .spinner-wrap {
      width: 80px; height: 80px;
      margin: 0 auto 28px;
      background: var(--surface-sunken);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner-wrap { background: transparent; }

    .spinner-large {
      width: 48px; height: 48px;
      border: 3px solid var(--sand);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .empty-icon svg { width: 32px; height: 32px; color: var(--text-muted); }

    .empty-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .empty-text {
      color: var(--text-muted);
      font-size: 15px;
      max-width: 280px;
      margin: 0 auto;
    }

    /* Modal - Elegant overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(44,44,44,0.4);
      backdrop-filter: blur(8px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-overlay.show { display: flex; }

    .modal {
      background: var(--surface-elevated);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-lg);
      max-width: 540px;
      width: 100%;
      max-height: 85vh;
      overflow: hidden;
      animation: modalIn 0.4s var(--ease-out);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      padding: 28px 28px 24px;
      position: relative;
      border-bottom: 1px solid var(--border-subtle);
    }

    .modal-close {
      position: absolute;
      top: 20px; right: 20px;
      width: 36px; height: 36px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--surface-sunken);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .modal-close:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .modal-eyebrow {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      line-height: 1.25;
      padding-right: 48px;
    }

    .modal-company {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    .modal-body {
      padding: 24px 28px;
      overflow-y: auto;
      max-height: calc(85vh - 220px);
    }

    .modal-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    .modal-meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--surface-sunken);
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .modal-meta-item svg { width: 15px; height: 15px; color: var(--sage); }

    .modal-desc {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text-secondary);
      white-space: pre-wrap;
      padding: 20px;
      background: var(--surface-sunken);
      border-radius: var(--radius-lg);
      max-height: 280px;
      overflow-y: auto;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      padding: 20px 28px 28px;
    }

    .modal-actions .btn {
      padding: 14px 24px;
    }

    /* Toast - Subtle */
    .toast {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--charcoal);
      color: var(--text-inverse);
      padding: 14px 24px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.35s var(--ease-out);
      z-index: 3000;
      box-shadow: var(--shadow-lg);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Action Notification - shows when user triggers ChatGPT action */
    .action-notification {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(135deg, var(--charcoal) 0%, #3d3d3d 100%);
      color: var(--text-inverse);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 4000;
      transform: translateY(100%);
      opacity: 0;
      transition: all 0.4s var(--ease-out);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
    }

    .action-notification.show {
      transform: translateY(0);
      opacity: 1;
    }

    .action-notification-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    .action-notification-content {
      flex: 1;
    }

    .action-notification-title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .action-notification-desc {
      font-size: 13px;
      opacity: 0.8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-notification-arrow {
      display: inline-block;
      animation: bounce 1s ease infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }

    .action-notification-close {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    .action-notification-close:hover {
      background: rgba(255,255,255,0.2);
    }

    .action-notification-close svg {
      width: 16px;
      height: 16px;
    }

    /* Inline salary section in modal */
    .modal-salary {
      margin-top: 20px;
      padding: 20px;
      background: linear-gradient(135deg, var(--sage-soft) 0%, var(--surface-sunken) 100%);
      border-radius: var(--radius-lg);
      border: 1px solid var(--sage);
    }

    .modal-salary-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .modal-salary-icon {
      font-size: 24px;
    }

    .modal-salary-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .modal-salary-amount {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .modal-salary-range {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .modal-salary-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .modal-salary-bar-fill {
      position: absolute;
      height: 100%;
      background: linear-gradient(90deg, var(--sage) 0%, var(--accent) 100%);
      border-radius: 4px;
    }

    .modal-salary-bar-marker {
      position: absolute;
      top: 50%;
      width: 14px;
      height: 14px;
      background: var(--accent);
      border: 2px solid var(--surface-elevated);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: var(--shadow-sm);
    }

    .modal-salary-tips {
      font-size: 13px;
      color: var(--text-secondary);
      padding-left: 16px;
      margin: 0;
    }

    .modal-salary-tips li {
      margin-bottom: 4px;
    }

    .modal-salary-sources {
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .modal-salary-loading {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px;
      background: var(--surface-sunken);
      border-radius: var(--radius-lg);
      margin-top: 20px;
    }

    .modal-salary-loading .spinner-small {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Mobile action notification */
    @media (max-width: 640px) {
      .action-notification {
        padding: 16px 20px;
        gap: 12px;
      }
      .action-notification-title {
        font-size: 14px;
      }
      .action-notification-desc {
        font-size: 12px;
      }
      .action-notification-spinner {
        width: 20px;
        height: 20px;
      }
      .action-notification-close {
        width: 28px;
        height: 28px;
      }
    }

    /* Map popups */
    .leaflet-popup-content-wrapper {
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      font-family: var(--font-body);
    }

    .map-popup { padding: 4px; }
    .map-popup-title {
      font-family: var(--font-display);
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 4px;
      font-size: 14px;
    }
    .map-popup-company { color: var(--text-muted); font-size: 12px; }
    .map-popup-btn {
      margin-top: 10px;
      padding: 8px 14px;
      background: var(--charcoal);
      color: var(--text-inverse);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s ease;
    }
    .map-popup-btn:hover { background: var(--accent); }

    /* Responsive */
    @media (max-width: 640px) {
      .header { padding: 28px 20px 24px; }
      .header::after { left: 20px; right: 20px; }
      .header-title { font-size: 28px; }
      .header-eyebrow { font-size: 10px; }
      .controls { padding: 16px 20px; gap: 8px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
      .control-btn { padding: 9px 16px; font-size: 12px; flex-shrink: 0; }
      .map-section { margin: 0 16px 20px; border-radius: var(--radius-lg); }
      .map-wrapper { height: 200px; }
      .job-grid { grid-template-columns: 1fr; padding: 0 16px 20px; gap: 16px; }
      .job-card-header { padding: 20px; }
      .job-card-title { font-size: 18px; }
      .job-card-footer { padding: 14px 20px; }
      .btn { padding: 11px 16px; }
      .pagination { padding: 24px 16px 32px; }
      .page-btn { min-width: 36px; height: 36px; font-size: 13px; }
      .empty-state, .loading-state { padding: 60px 20px; }
      .modal-overlay { padding: 0; align-items: flex-end; }
      .modal {
        max-height: 92vh;
        border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
        animation: slideUp 0.4s var(--ease-out);
      }
      @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
      .modal-header { padding: 24px 20px 20px; }
      .modal-title { font-size: 20px; }
      .modal-body { padding: 20px; }
      .modal-actions { padding: 16px 20px 24px; flex-direction: column; }
    }

    /* RTL Support */
    [dir="rtl"] .header-eyebrow::before { display: none; }
    [dir="rtl"] .header-eyebrow::after { content: ''; width: 24px; height: 2px; background: var(--accent); }
    [dir="rtl"] .job-card-top { flex-direction: row-reverse; }
    [dir="rtl"] .job-card-company { flex-direction: row-reverse; }
    [dir="rtl"] .job-card-footer { flex-direction: row-reverse; }
    [dir="rtl"] .controls { flex-direction: row-reverse; }
    [dir="rtl"] .modal-title { padding-right: 0; padding-left: 48px; }
    [dir="rtl"] .modal-close { right: auto; left: 20px; }

    /* Animation stagger for cards */
    .job-card {
      animation: cardIn 0.5s var(--ease-out) backwards;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .job-grid .job-card:nth-child(1) { animation-delay: 0.05s; }
    .job-grid .job-card:nth-child(2) { animation-delay: 0.1s; }
    .job-grid .job-card:nth-child(3) { animation-delay: 0.15s; }
    .job-grid .job-card:nth-child(4) { animation-delay: 0.2s; }
    .job-grid .job-card:nth-child(5) { animation-delay: 0.25s; }
    .job-grid .job-card:nth-child(6) { animation-delay: 0.3s; }
    .job-grid .job-card:nth-child(7) { animation-delay: 0.35s; }
    .job-grid .job-card:nth-child(8) { animation-delay: 0.4s; }
    .job-grid .job-card:nth-child(9) { animation-delay: 0.45s; }
    .job-grid .job-card:nth-child(10) { animation-delay: 0.5s; }
    .job-grid .job-card:nth-child(11) { animation-delay: 0.55s; }
    .job-grid .job-card:nth-child(12) { animation-delay: 0.6s; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const JOBS_PER_PAGE = 12;
    const BATCH_SIZE = 100;

    const cityCoords = {
      'stockholm': [59.3293, 18.0686], 'goteborg': [57.7089, 11.9746], 'malmo': [55.6050, 13.0038],
      'uppsala': [59.8586, 17.6389], 'linkoping': [58.4108, 15.6214], 'orebro': [59.2753, 15.2134],
      'vasteras': [59.6099, 16.5448], 'helsingborg': [56.0465, 12.6945], 'jonkoping': [57.7826, 14.1618],
      'lund': [55.7047, 13.1910], 'umea': [63.8258, 20.2630], 'gavle': [60.6749, 17.1413],
      'default': [62.0, 15.0]
    };

    const hashCode = (str) => { let hash = 0; for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash |= 0; } return hash; };

    const getCoords = (job) => {
      if (job.lat && job.lng) return [job.lat, job.lng];
      const hash = hashCode(job.id || job.location || 'default');
      const offsetLat = ((hash % 1000) / 1000 - 0.5) * 0.03;
      const offsetLng = (((hash >> 10) % 1000) / 1000 - 0.5) * 0.03;
      const loc = (job.location || '').toLowerCase().replace(/[åäö]/g, c => c === 'ö' ? 'o' : 'a');
      for (const [city, coords] of Object.entries(cityCoords)) {
        if (loc.includes(city)) return [coords[0] + offsetLat, coords[1] + offsetLng];
      }
      return [cityCoords.default[0] + offsetLat, cityCoords.default[1] + offsetLng];
    };

    const getInitials = (name) => name ? name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase() : '?';

    const translateText = async (text, lang) => {
      if (!text || lang === 'sv') return text;
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=sv&tl=${lang}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        return data?.[0]?.map(i => i[0]).join('') || text;
      } catch { return text; }
    };

    const translateBatch = async (texts, lang) => {
      if (!texts.length || lang === 'sv') return texts;
      try {
        const d = ' ||| ';
        const translated = await translateText(texts.join(d), lang);
        return translated.split(d).map(t => t.trim());
      } catch { return texts; }
    };

    const translateJobs = async (jobs, lang) => {
      if (!jobs.length || lang === 'sv') return jobs;
      const [titles, locs] = await Promise.all([translateBatch(jobs.map(j => j.title), lang), translateBatch(jobs.map(j => j.location), lang)]);
      return jobs.map((j, i) => ({ ...j, title: titles[i] || j.title, location: locs[i] || j.location }));
    };

    const translateLabels = async (labels, lang) => {
      if (lang === 'sv') return labels;
      const keys = Object.keys(labels);
      const vals = await translateBatch(Object.values(labels), lang);
      return keys.reduce((acc, k, i) => ({ ...acc, [k]: vals[i] || labels[k] }), {});
    };

    const CompanyLogo = ({ name, logoUrl, size = 44 }) => {
      const [src, setSrc] = useState(0);
      const domain = name?.toLowerCase().replace(/\s*(ab|hb|kb)\s*/gi, '').replace(/[^a-z0-9]/gi, '').replace(/[åäö]/g, c => c === 'ö' ? 'o' : 'a');
      const sources = [logoUrl, domain?.length > 2 && `https://logo.clearbit.com/${domain}.se`, `https://ui-avatars.com/api/?name=${encodeURIComponent(name || '?')}&background=7B9E87&color=fff&size=${size * 2}&bold=true&format=svg`].filter(Boolean);
      if (src === -1 || !sources.length) return <div className="company-logo-fallback" style={{ width: size, height: size }}>{getInitials(name)}</div>;
      return <img src={sources[src]} alt={name} className="company-logo" style={{ width: size, height: size }} onError={() => setSrc(p => p < sources.length - 1 ? p + 1 : -1)} />;
    };

    const MapIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>;
    const ClockIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const HeartIcon = ({ filled }) => <svg viewBox="0 0 24 24" fill={filled ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>;
    const CloseIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>;
    const SearchIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>;
    const ExternalIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>;

    const JobCard = ({ job, isSaved, onSave, onClick, labels }) => (
      <div className="job-card" onClick={() => onClick(job)}>
        <div className="job-card-inner">
          <div className="job-card-header">
            <div className="job-card-top">
              <div className="job-card-company">
                <CompanyLogo name={job.employer} logoUrl={job.logoUrl} />
                <div className="company-info">
                  <div className="company-name">{job.employer}</div>
                  {job.employmentType && <span className="job-type-badge">{job.employmentType}</span>}
                </div>
              </div>
              <button
                className={`save-btn ${isSaved ? 'saved' : ''}`}
                onClick={e => { e.stopPropagation(); onSave(job.id); }}
                aria-label={isSaved ? 'Unsave' : 'Save'}
              >
                <HeartIcon filled={isSaved} />
              </button>
            </div>
            <div className="job-card-title">{job.title}</div>
            <div className="job-card-meta">
              <span className="job-meta-item"><MapIcon />{job.location || 'Sverige'}</span>
              {job.deadline && <span className="job-meta-item"><ClockIcon />{job.deadline}</span>}
            </div>
          </div>
          <div className="job-card-footer">
            <button className="btn btn-secondary" onClick={e => { e.stopPropagation(); onClick(job); }}>{labels.showMore}</button>
            <button className="btn btn-primary" onClick={e => { e.stopPropagation(); window.openai?.openExternal?.({ href: job.url }); }}><ExternalIcon />{labels.apply}</button>
          </div>
        </div>
      </div>
    );

    const Pagination = ({ currentPage, totalPages, onPageChange }) => {
      if (totalPages <= 1) return null;
      const pages = [];
      if (totalPages <= 5) for (let i = 1; i <= totalPages; i++) pages.push(i);
      else if (currentPage <= 3) pages.push(1, 2, 3, 4, '...', totalPages);
      else if (currentPage >= totalPages - 2) pages.push(1, '...', totalPages - 3, totalPages - 2, totalPages - 1, totalPages);
      else pages.push(1, '...', currentPage - 1, currentPage, currentPage + 1, '...', totalPages);
      return (
        <div className="pagination">
          <button className="page-btn" onClick={() => onPageChange(currentPage - 1)} disabled={currentPage === 1}>‹</button>
          {pages.map((p, i) => p === '...' ? <span key={`d${i}`} className="page-dots">…</span> : <button key={p} className={`page-btn ${p === currentPage ? 'active' : ''}`} onClick={() => onPageChange(p)}>{p}</button>)}
          <button className="page-btn" onClick={() => onPageChange(currentPage + 1)} disabled={currentPage === totalPages}>›</button>
        </div>
      );
    };

    const Modal = ({ job, onClose, labels, targetLanguage, salaryData, salaryLoading, requestSalary }) => {
      const [details, setDetails] = useState(null);
      const [loading, setLoading] = useState(false);
      const [desc, setDesc] = useState(null);

      useEffect(() => {
        if (!job) return;
        (async () => {
          let data = job;
          if (!job.fullDescription && !job.description) {
            setLoading(true);
            try { const r = await fetch(`https://api.smidra.se/api/job/${job.id}`); data = { ...job, ...await r.json() }; setDetails(data); } catch { setDetails(job); setLoading(false); return; }
          } else setDetails(job);
          const d = data.fullDescription || data.description || '';
          setDesc(targetLanguage && targetLanguage !== 'sv' ? await translateText(d, targetLanguage) : d);
          setLoading(false);
        })();
      }, [job, targetLanguage]);

      if (!job) return null;
      const d = details || job;

      // Format salary number with thousands separator
      const formatSalary = (num) => num ? num.toLocaleString('sv-SE') : '0';

      // Calculate bar position percentage
      const getBarPosition = (salary) => {
        if (!salary) return 50;
        const range = salary.max - salary.min;
        if (range <= 0) return 50;
        return Math.min(100, Math.max(0, ((salary.avg - salary.min) / range) * 100));
      };

      return (
        <div className="modal-overlay show" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-eyebrow">{d.employer}</div>
              <div className="modal-title">{d.title}</div>
              <button className="modal-close" onClick={onClose}><CloseIcon /></button>
            </div>
            <div className="modal-body">
              <div className="modal-meta">
                <span className="modal-meta-item"><MapIcon />{d.location || 'Sverige'}</span>
                {d.deadline && <span className="modal-meta-item"><ClockIcon />{d.deadline}</span>}
                {d.employmentType && <span className="modal-meta-item">{d.employmentType}</span>}
              </div>
              {loading ? <div style={{ textAlign: 'center', padding: 40 }}><div className="spinner-large" style={{ margin: '0 auto 20px' }} /><div style={{ color: 'var(--text-muted)', fontSize: 14 }}>{labels.loadingDesc}</div></div> : <div className="modal-desc">{desc || labels.noDesc}</div>}

              {/* Inline salary section */}
              {salaryLoading && (
                <div className="modal-salary-loading">
                  <div className="spinner-small" />
                  <span style={{ color: 'var(--text-secondary)', fontSize: 14 }}>Hämtar lönestatistik...</span>
                </div>
              )}

              {salaryData && salaryData.salary && (
                <div className="modal-salary">
                  <div className="modal-salary-header">
                    <span className="modal-salary-icon">💰</span>
                    <span className="modal-salary-title">Lönestatistik</span>
                  </div>
                  <div className="modal-salary-amount">{formatSalary(salaryData.salary.avg)} kr/mån</div>
                  <div className="modal-salary-range">
                    <span>Min: {formatSalary(salaryData.salary.min)} kr</span>
                    <span>Max: {formatSalary(salaryData.salary.max)} kr</span>
                  </div>
                  <div className="modal-salary-bar">
                    <div className="modal-salary-bar-fill" style={{ width: '100%' }} />
                    <div className="modal-salary-bar-marker" style={{ left: `${getBarPosition(salaryData.salary)}%` }} />
                  </div>
                  {salaryData.tips && salaryData.tips.length > 0 && (
                    <ul className="modal-salary-tips">
                      {salaryData.tips.map((tip, i) => <li key={i}>{tip}</li>)}
                    </ul>
                  )}
                  {salaryData.sources && salaryData.sources.length > 0 && (
                    <div className="modal-salary-sources">Källor: {salaryData.sources.join(', ')}</div>
                  )}
                </div>
              )}
            </div>
            <div className="modal-actions">
              <button
                className="btn btn-secondary"
                onClick={() => requestSalary(d)}
                disabled={salaryLoading || salaryData}
              >
                {salaryLoading ? 'Hämtar...' : salaryData ? '✓ Lönedata visas' : labels.salaryInfo}
              </button>
              <button className="btn btn-primary" onClick={() => window.openai?.openExternal?.({ href: d.url })}><ExternalIcon />{labels.applyNow}</button>
            </div>
          </div>
        </div>
      );
    };

    const Toast = ({ message, visible }) => <div className={`toast ${visible ? 'show' : ''}`}>{message}</div>;

    const ActionNotification = ({ visible, title, description, onClose }) => (
      <div className={`action-notification ${visible ? 'show' : ''}`}>
        <div className="action-notification-spinner" />
        <div className="action-notification-content">
          <div className="action-notification-title">{title}</div>
          <div className="action-notification-desc">
            <span className="action-notification-arrow">↓</span>
            {description}
          </div>
        </div>
        <button className="action-notification-close" onClick={onClose}>
          <CloseIcon />
        </button>
      </div>
    );

    const App = () => {
      const [jobs, setJobs] = useState([]);
      const [query, setQuery] = useState('');
      const [location, setLocation] = useState('');
      const [filter, setFilter] = useState('all');
      const [currentPage, setCurrentPage] = useState(1);
      const [showMap, setShowMap] = useState(false);
      const [savedJobs, setSavedJobs] = useState([]);
      const [selectedJob, setSelectedJob] = useState(null);
      const [loading, setLoading] = useState(true);
      const [loadingText, setLoadingText] = useState('Söker efter lediga tjänster...');
      const [totalAvailable, setTotalAvailable] = useState(0);
      const [loadedCount, setLoadedCount] = useState(0);
      const [toast, setToast] = useState({ message: '', visible: false });
      const [actionNotif, setActionNotif] = useState({ visible: false, title: '', description: '' });
      const [targetLanguage, setTargetLanguage] = useState('sv');
      const [widgetSessionId] = useState(() => 'ws_' + Math.random().toString(36).substr(2, 9));
      const [salaryData, setSalaryData] = useState(null);
      const [salaryLoading, setSalaryLoading] = useState(false);
      const eventSourceRef = useRef(null);

      const defaultLabels = { jobs: 'jobb', map: 'Karta', all: 'Alla', fulltime: 'Heltid', parttime: 'Deltid', showMore: 'Läs mer', apply: 'Ansök', saved: 'Sparad!', noJobs: 'Inga jobb hittades', tryOther: 'Prova att söka efter något annat', loadingDesc: 'Laddar...', noDesc: 'Ingen beskrivning tillgänglig.', applyNow: 'Ansök nu', salaryInfo: 'Löneinfo', sending: 'Skickar...' };
      const [labels, setLabels] = useState(defaultLabels);

      const mapRef = useRef(null);
      const mapInstance = useRef(null);
      const markers = useRef([]);
      const markerIds = useRef(new Set());
      const searchId = useRef(0);
      const loadingMore = useRef(false);
      const loadedRef = useRef(0);
      const totalRef = useRef(0);
      const searchParams = useRef({ query: '', location: '' });
      const langRef = useRef('sv');
      const labelsRef = useRef(defaultLabels);

      const showToastMsg = useCallback(msg => { setToast({ message: msg, visible: true }); setTimeout(() => setToast(t => ({ ...t, visible: false })), 2500); }, []);
      const showActionNotif = useCallback((title, description) => {
        setActionNotif({ visible: true, title, description });
        setTimeout(() => setActionNotif(n => ({ ...n, visible: false })), 8000);
      }, []);
      const hideActionNotif = useCallback(() => setActionNotif(n => ({ ...n, visible: false })), []);

      // SSE connection for real-time updates
      useEffect(() => {
        console.log('🔌 Connecting SSE:', widgetSessionId);
        const es = new EventSource(`https://api.smidra.se/events?session=${widgetSessionId}`);
        eventSourceRef.current = es;

        es.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            console.log('📨 SSE event:', data.type);

            if (data.type === 'salary') {
              setSalaryData(data);
              setSalaryLoading(false);
              hideActionNotif();
            }
          } catch (e) {
            console.error('SSE parse error:', e);
          }
        };

        es.onerror = (e) => {
          console.log('SSE error, reconnecting...');
        };

        return () => {
          console.log('🔌 Closing SSE');
          es.close();
        };
      }, [widgetSessionId, hideActionNotif]);

      // Reset salary data when modal closes
      const handleCloseModal = useCallback(() => {
        setSelectedJob(null);
        setSalaryData(null);
        setSalaryLoading(false);
      }, []);

      // Request salary via ChatGPT web search + SSE push to widget
      const requestSalary = useCallback((job) => {
        setSalaryLoading(true);
        setSalaryData(null);
        showActionNotif('Söker lönestatistik...', 'Se svaret i chatten nedan ↓');
        window.openai?.sendFollowUpMessage?.({
          prompt: `Sök lönestatistik för "${job.title}" i ${job.location || 'Sverige'}.

widgetSessionId: ${widgetSessionId}

Hitta aktuell lönedata och visa i min öppna modal med show_salary_inline.`
        });
      }, [widgetSessionId, showActionNotif]);
      useEffect(() => { labelsRef.current = labels; }, [labels]);

      const toggleSave = useCallback(id => { setSavedJobs(p => p.includes(id) ? p.filter(x => x !== id) : (showToastMsg(labelsRef.current.saved), [...p, id])); }, [showToastMsg]);

      const filtered = jobs.filter(j => filter === 'all' || (j.employmentType || '').toLowerCase().includes(filter === 'fulltime' ? 'heltid' : 'deltid'));
      const totalPages = Math.ceil(filtered.length / JOBS_PER_PAGE);
      const pageJobs = filtered.slice((currentPage - 1) * JOBS_PER_PAGE, currentPage * JOBS_PER_PAGE);

      useEffect(() => {
        if (!mapRef.current || mapInstance.current) return;
        mapInstance.current = L.map(mapRef.current).setView([62, 15], 5);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '© OSM © CARTO', maxZoom: 18 }).addTo(mapInstance.current);
      }, [showMap]);

      useEffect(() => {
        if (!mapInstance.current || !showMap || !filtered.length) { markers.current.forEach(m => mapInstance.current?.removeLayer(m)); markers.current = []; markerIds.current.clear(); return; }
        const newJobs = filtered.filter(j => !markerIds.current.has(j.id));
        if (!newJobs.length) return;
        const bounds = [];
        newJobs.forEach(j => {
          const c = getCoords(j); bounds.push(c);
          const m = L.circleMarker(c, { radius: 8, fillColor: '#C85A38', color: '#fff', weight: 2, fillOpacity: 0.9 }).addTo(mapInstance.current);
          m.bindPopup(`<div class="map-popup"><div class="map-popup-title">${j.title}</div><div class="map-popup-company">${j.employer}</div><button class="map-popup-btn" onclick="window.openJobFromMap('${j.id}')">Visa</button></div>`);
          markers.current.push(m); markerIds.current.add(j.id);
        });
        if (markers.current.length === newJobs.length) mapInstance.current.fitBounds(bounds, { padding: [40, 40], maxZoom: 7 });
      }, [filtered, showMap]);

      const prevFilter = useRef(filter);
      useEffect(() => { if (prevFilter.current !== filter) { markers.current.forEach(m => mapInstance.current?.removeLayer(m)); markers.current = []; markerIds.current.clear(); prevFilter.current = filter; } }, [filter]);
      useEffect(() => { mapInstance.current && setTimeout(() => mapInstance.current.invalidateSize(), 400); }, [showMap]);
      useEffect(() => { window.openJobFromMap = id => { const j = jobs.find(x => x.id === id); if (j) setSelectedJob(j); }; return () => delete window.openJobFromMap; }, [jobs]);

      const loadMore = useCallback(async sid => {
        if (loadingMore.current || loadedRef.current >= totalRef.current || sid !== searchId.current) return;
        loadingMore.current = true;
        try {
          const p = new URLSearchParams({ q: searchParams.current.query || 'jobb', limit: BATCH_SIZE, offset: loadedRef.current });
          if (searchParams.current.location) p.set('location', searchParams.current.location);
          const r = await fetch(`https://api.smidra.se/api/search?${p}`);
          const d = await r.json();
          if (sid !== searchId.current) { loadingMore.current = false; return; }
          if (d.jobs?.length) {
            let nj = d.jobs;
            if (langRef.current !== 'sv') nj = await translateJobs(nj, langRef.current);
            setJobs(p => [...p, ...nj]);
            loadedRef.current += nj.length;
            setLoadedCount(loadedRef.current);
            if (loadedRef.current < totalRef.current) { loadingMore.current = false; setTimeout(() => loadMore(sid), 150); return; }
          }
        } catch {}
        loadingMore.current = false;
      }, []);

      const handleData = useCallback(async (data, more = false) => {
        if (!data) return;
        searchId.current++;
        const sid = searchId.current;
        loadingMore.current = false;
        if (mapInstance.current) { markers.current.forEach(m => mapInstance.current.removeLayer(m)); markers.current = []; markerIds.current.clear(); }
        const init = data.jobs?.length || 0;
        const total = data.total || init;
        loadedRef.current = init; totalRef.current = total;
        searchParams.current = { query: data.querySwedish || data.query || '', location: data.locationSwedish || '' };
        const lang = data.language || 'sv';
        setTargetLanguage(lang); langRef.current = lang;

        if (data.translateMode && lang !== 'sv' && data.jobs?.length) {
          setLoading(true); setLoadingText(data.translatingText || 'Translating...');
          try {
            const [tj, tq, tl, tlb] = await Promise.all([translateJobs(data.jobs, lang), translateText(data.querySwedish || data.query || '', lang), translateText(data.locationSwedish || data.location || '', lang), translateLabels(defaultLabels, lang)]);
            if (sid !== searchId.current) return;
            setJobs(tj); setQuery(tq); setLocation(tl); setLabels(tlb);
          } catch { setJobs(data.jobs || []); setQuery(data.querySwedish || data.query || ''); setLocation(data.locationSwedish || data.location || ''); }
          setLoading(false);
        } else { setJobs(data.jobs || []); setQuery(data.query || data.querySwedish || ''); setLocation(data.location || data.locationSwedish || ''); setLoading(false); }
        setTotalAvailable(total); setLoadedCount(init); setCurrentPage(1);
        if (more && init < total) setTimeout(() => loadMore(sid), 500);
      }, [loadMore]);

      useEffect(() => {
        if (window.openai?.widgetState?.savedJobs) setSavedJobs(window.openai.widgetState.savedJobs);
        const h = () => window.openai?.toolOutput && handleData(window.openai.toolOutput, true);
        window.addEventListener('openai:set_globals', h);
        if (window.openai?.toolOutput) handleData(window.openai.toolOutput, true);
        if (window.openai?.theme) document.documentElement.setAttribute('data-theme', window.openai.theme);
        return () => window.removeEventListener('openai:set_globals', h);
      }, [handleData]);

      useEffect(() => { window.openai?.notifyIntrinsicHeight?.(document.body.scrollHeight); }, [pageJobs, showMap]);

      return (
        <div className="container">
          <div className="header">
            <div className="header-eyebrow">Jobbsökning</div>
            <div className="header-title">{query || 'Lediga tjänster'}</div>
            <div className="header-meta">
              {location && <div className="header-location"><MapIcon />{location}</div>}
              <div className="header-count">
                <span className="header-count-num">{totalAvailable}</span>
                <span>{labels.jobs}</span>
                {loadedCount < totalAvailable && <span className="header-loading" />}
              </div>
            </div>
          </div>

          <div className="controls">
            <button className={`control-btn ${showMap ? 'primary' : ''}`} onClick={() => setShowMap(!showMap)}><MapIcon />{labels.map}</button>
            <button className={`control-btn ${filter === 'all' ? 'active' : ''}`} onClick={() => { setFilter('all'); setCurrentPage(1); }}>{labels.all}</button>
            <button className={`control-btn ${filter === 'fulltime' ? 'active' : ''}`} onClick={() => { setFilter('fulltime'); setCurrentPage(1); }}>{labels.fulltime}</button>
            <button className={`control-btn ${filter === 'parttime' ? 'active' : ''}`} onClick={() => { setFilter('parttime'); setCurrentPage(1); }}>{labels.parttime}</button>
          </div>

          <div className={`map-section ${showMap ? '' : 'collapsed'}`}><div className="map-wrapper"><div id="map" ref={mapRef} /><div className="map-info"><span className="dot" /><span>{filtered.length} {labels.jobs}</span></div></div></div>

          {loading ? <div className="loading-state"><div className="spinner-wrap"><div className="spinner-large" /></div><div className="empty-text">{loadingText}</div></div>
           : !filtered.length ? <div className="empty-state"><div className="empty-icon"><SearchIcon /></div><div className="empty-title">{labels.noJobs}</div><div className="empty-text">{labels.tryOther}</div></div>
           : <><div className="job-grid" key={currentPage}>{pageJobs.map(j => <JobCard key={j.id} job={j} isSaved={savedJobs.includes(j.id)} onSave={toggleSave} onClick={setSelectedJob} labels={labels} />)}</div><Pagination currentPage={currentPage} totalPages={totalPages} onPageChange={p => { setCurrentPage(p); window.scrollTo({ top: 0, behavior: 'smooth' }); }} /></>}

          {selectedJob && <Modal job={selectedJob} onClose={handleCloseModal} labels={labels} targetLanguage={targetLanguage} salaryData={salaryData} salaryLoading={salaryLoading} requestSalary={requestSalary} />}
          <Toast message={toast.message} visible={toast.visible} />
          <ActionNotification
            visible={actionNotif.visible}
            title={actionNotif.title}
            description={actionNotif.description}
            onClose={hideActionNotif}
          />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
