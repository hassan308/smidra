<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smidra - Job Search</title>
  <style>
    :root {
      --background: 0 0% 100%;
      --foreground: 222.2 84% 4.9%;
      --card: 0 0% 100%;
      --card-foreground: 222.2 84% 4.9%;
      --popover: 0 0% 100%;
      --popover-foreground: 222.2 84% 4.9%;
      --primary: 221.2 83.2% 53.3%;
      --primary-foreground: 210 40% 98%;
      --secondary: 210 40% 96.1%;
      --secondary-foreground: 222.2 47.4% 11.2%;
      --muted: 210 40% 96.1%;
      --muted-foreground: 215.4 16.3% 46.9%;
      --accent: 210 40% 96.1%;
      --accent-foreground: 222.2 47.4% 11.2%;
      --destructive: 0 84.2% 60.2%;
      --destructive-foreground: 210 40% 98%;
      --border: 214.3 31.8% 91.4%;
      --input: 214.3 31.8% 91.4%;
      --ring: 221.2 83.2% 53.3%;
      --radius: 0.5rem;
      --success: 142.1 76.2% 36.3%;
      --warning: 45.4 93.4% 47.5%;
    }

    [data-theme="dark"] {
      --background: 222.2 84% 4.9%;
      --foreground: 210 40% 98%;
      --card: 222.2 84% 4.9%;
      --card-foreground: 210 40% 98%;
      --primary: 217.2 91.2% 59.8%;
      --primary-foreground: 222.2 47.4% 11.2%;
      --secondary: 217.2 32.6% 17.5%;
      --secondary-foreground: 210 40% 98%;
      --muted: 217.2 32.6% 17.5%;
      --muted-foreground: 215 20.2% 65.1%;
      --accent: 217.2 32.6% 17.5%;
      --accent-foreground: 210 40% 98%;
      --border: 217.2 32.6% 17.5%;
      --input: 217.2 32.6% 17.5%;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Header */
    .header {
      margin-bottom: 16px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      color: hsl(var(--foreground));
    }

    .header-badge {
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      color: hsl(var(--muted-foreground));
      font-size: 14px;
    }

    .header-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: hsl(var(--secondary));
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius);
      font-size: 13px;
      color: hsl(var(--secondary-foreground));
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover {
      background: hsl(var(--accent));
      border-color: hsl(var(--primary));
    }

    .filter-btn.active {
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border-color: hsl(var(--primary));
    }

    /* Action Bar */
    .action-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      padding: 12px;
      background: hsl(var(--muted));
      border-radius: var(--radius);
    }

    .action-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      background: hsl(var(--background));
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      color: hsl(var(--foreground));
      cursor: pointer;
      transition: all 0.15s;
    }

    .action-btn:hover {
      border-color: hsl(var(--primary));
      color: hsl(var(--primary));
    }

    .action-btn.primary {
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border-color: hsl(var(--primary));
    }

    .action-btn .count {
      background: hsl(var(--destructive));
      color: white;
      padding: 2px 6px;
      border-radius: 9999px;
      font-size: 11px;
    }

    /* Job List */
    .job-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Job Card */
    .job-card {
      background: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius);
      overflow: hidden;
      transition: all 0.2s;
    }

    .job-card:hover {
      border-color: hsl(var(--primary) / 0.5);
      box-shadow: 0 4px 12px hsl(var(--primary) / 0.1);
    }

    .job-card.selected {
      border-color: hsl(var(--primary));
      background: hsl(var(--primary) / 0.05);
    }

    .job-card.saved {
      border-left: 3px solid hsl(var(--success));
    }

    .job-main {
      padding: 16px;
    }

    .job-header {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .job-logo {
      width: 48px;
      height: 48px;
      border-radius: var(--radius);
      background: hsl(var(--muted));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      color: hsl(var(--muted-foreground));
      flex-shrink: 0;
      overflow: hidden;
    }

    .job-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .job-info {
      flex: 1;
      min-width: 0;
    }

    .job-employer {
      font-size: 13px;
      color: hsl(var(--muted-foreground));
      margin-bottom: 2px;
    }

    .job-title {
      font-size: 16px;
      font-weight: 600;
      color: hsl(var(--foreground));
      margin-bottom: 4px;
    }

    .job-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: hsl(var(--secondary));
      border-radius: 9999px;
      font-size: 12px;
      color: hsl(var(--secondary-foreground));
    }

    .tag.location {
      background: hsl(var(--primary) / 0.1);
      color: hsl(var(--primary));
    }

    .tag.urgent {
      background: hsl(var(--destructive) / 0.1);
      color: hsl(var(--destructive));
    }

    .tag.deadline {
      background: hsl(var(--warning) / 0.1);
      color: hsl(45 93% 30%);
    }

    .job-select {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 2px solid hsl(var(--border));
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .job-select:hover {
      border-color: hsl(var(--primary));
    }

    .job-select.checked {
      background: hsl(var(--primary));
      border-color: hsl(var(--primary));
      color: white;
    }

    .job-description {
      font-size: 14px;
      color: hsl(var(--muted-foreground));
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Job Actions */
    .job-actions {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid hsl(var(--border));
    }

    .job-action {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      background: transparent;
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      color: hsl(var(--foreground));
      cursor: pointer;
      transition: all 0.15s;
    }

    .job-action:hover {
      background: hsl(var(--secondary));
    }

    .job-action.primary {
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border-color: hsl(var(--primary));
    }

    .job-action.primary:hover {
      background: hsl(var(--primary) / 0.9);
    }

    .job-action.save {
      color: hsl(var(--muted-foreground));
    }

    .job-action.save.saved {
      color: hsl(var(--destructive));
      border-color: hsl(var(--destructive) / 0.3);
      background: hsl(var(--destructive) / 0.05);
    }

    /* Expanded Details */
    .job-details {
      display: none;
      padding: 16px;
      background: hsl(var(--muted));
      border-top: 1px solid hsl(var(--border));
    }

    .job-card.expanded .job-details {
      display: block;
    }

    .detail-section {
      margin-bottom: 16px;
    }

    .detail-section:last-child {
      margin-bottom: 0;
    }

    .detail-title {
      font-size: 13px;
      font-weight: 600;
      color: hsl(var(--foreground));
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .detail-item {
      background: hsl(var(--background));
      padding: 10px 12px;
      border-radius: var(--radius);
      border: 1px solid hsl(var(--border));
    }

    .detail-label {
      font-size: 11px;
      color: hsl(var(--muted-foreground));
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 500;
      color: hsl(var(--foreground));
    }

    .detail-description {
      font-size: 14px;
      color: hsl(var(--foreground));
      line-height: 1.6;
      background: hsl(var(--background));
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid hsl(var(--border));
      max-height: 200px;
      overflow-y: auto;
    }

    /* Detail Actions */
    .detail-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .detail-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: hsl(var(--background));
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      color: hsl(var(--foreground));
      cursor: pointer;
      transition: all 0.15s;
    }

    .detail-action:hover {
      border-color: hsl(var(--primary));
      color: hsl(var(--primary));
    }

    .detail-action.primary {
      grid-column: span 2;
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border-color: hsl(var(--primary));
    }

    /* Empty State */
    .empty {
      text-align: center;
      padding: 48px 24px;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-text {
      color: hsl(var(--muted-foreground));
    }

    /* Loading */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid hsl(var(--border));
      border-top-color: hsl(var(--primary));
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 12px;
      color: hsl(var(--muted-foreground));
      font-size: 14px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: hsl(var(--foreground));
      color: hsl(var(--background));
      padding: 12px 20px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
    }

    /* Message Dialog */
    .message-dialog {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .message-dialog.open {
      opacity: 1;
    }

    .dialog-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
    }

    .dialog-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      background: hsl(var(--card));
      border-radius: calc(var(--radius) * 2);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      width: calc(100% - 32px);
      max-width: 400px;
      max-height: 80vh;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .message-dialog.open .dialog-content {
      transform: translate(-50%, -50%) scale(1);
    }

    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid hsl(var(--border));
      font-weight: 600;
      font-size: 16px;
    }

    .dialog-close {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: hsl(var(--muted-foreground));
      padding: 4px 8px;
      border-radius: var(--radius);
      transition: background 0.15s;
    }

    .dialog-close:hover {
      background: hsl(var(--secondary));
    }

    .dialog-body {
      padding: 20px;
    }

    .dialog-instruction {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: hsl(var(--muted-foreground));
    }

    .dialog-message {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      resize: none;
      background: hsl(var(--secondary));
      color: hsl(var(--foreground));
    }

    .dialog-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 16px 20px;
      border-top: 1px solid hsl(var(--border));
      background: hsl(var(--secondary) / 0.5);
    }

    .dialog-btn {
      padding: 10px 20px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
    }

    .dialog-btn.secondary {
      background: hsl(var(--secondary));
      color: hsl(var(--foreground));
    }

    .dialog-btn.secondary:hover {
      background: hsl(var(--border));
    }

    .dialog-btn.primary {
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
    }

    .dialog-btn.primary:hover {
      opacity: 0.9;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* RTL Support */
    [dir="rtl"] {
      direction: rtl;
    }

    [dir="rtl"] .job-header,
    [dir="rtl"] .job-tags,
    [dir="rtl"] .job-actions,
    [dir="rtl"] .filters,
    [dir="rtl"] .action-bar {
      flex-direction: row-reverse;
    }

    [dir="rtl"] .job-card.saved {
      border-left: none;
      border-right: 3px solid hsl(var(--success));
    }

    /* Responsive */
    @media (max-width: 480px) {
      .detail-grid {
        grid-template-columns: 1fr;
      }
      .detail-actions {
        grid-template-columns: 1fr;
      }
      .detail-action.primary {
        grid-column: span 1;
      }
      .action-bar {
        flex-wrap: wrap;
      }
      .action-btn {
        flex: 1 1 45%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="app">
      <div class="loading">
        <div class="spinner"></div>
        <div class="loading-text">Laddar jobb...</div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    // State
    const state = {
      theme: 'light',
      direction: 'ltr',
      language: 'sv',
      data: null,
      labels: {},
      savedJobs: [],
      selectedJobs: [],
      expandedJob: null,
      filters: {
        type: null // 'heltid', 'deltid', etc.
      }
    };

    // Default labels
    const defaultLabels = {
      results: 'Sökresultat',
      jobs: 'jobb',
      found: 'hittade',
      save: 'Spara',
      saved: 'Sparad',
      details: 'Detaljer',
      hide: 'Dölj',
      apply: 'Ansök',
      share: 'Dela',
      salary: 'Lönestatistik',
      help: 'Ansökningshjälp',
      compare: 'Jämför',
      viewSaved: 'Sparade',
      location: 'Plats',
      deadline: 'Sista ansökningsdag',
      type: 'Anställning',
      salaryType: 'Lön',
      description: 'Beskrivning',
      noJobs: 'Inga jobb hittades',
      tryAgain: 'Prova andra sökord',
      daysLeft: 'dagar kvar',
      today: 'Idag!',
      expired: 'Utgången',
      fullTime: 'Heltid',
      partTime: 'Deltid',
      all: 'Alla',
      selected: 'valda',
      copied: 'Länk kopierad!',
      jobSaved: 'Jobb sparat!',
      jobRemoved: 'Jobb borttaget'
    };

    // Get label
    function t(key) {
      return state.labels[key] || defaultLabels[key] || key;
    }

    // Escape HTML
    function esc(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // Get initials
    function initials(name) {
      if (!name) return '?';
      return name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
    }

    // Days until deadline
    function daysUntil(dateStr) {
      if (!dateStr) return null;
      const match = dateStr.match(/(\d{4})-(\d{2})-(\d{2})/);
      if (!match) return null;
      const date = new Date(match[1], match[2] - 1, match[3]);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.ceil((date - today) / 86400000);
    }

    // Show toast
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Notify height
    function notifyHeight() {
      window.openai?.notifyIntrinsicHeight?.(document.body.scrollHeight);
    }

    // Save state
    function saveState() {
      window.openai?.setWidgetState?.({
        savedJobs: state.savedJobs,
        selectedJobs: state.selectedJobs
      });
    }

    // Toggle save job
    function toggleSave(jobId) {
      const idx = state.savedJobs.indexOf(jobId);
      if (idx >= 0) {
        state.savedJobs.splice(idx, 1);
        showToast(t('jobRemoved'));
      } else {
        state.savedJobs.push(jobId);
        showToast(t('jobSaved'));
      }
      saveState();
      render();
    }

    // Toggle select job (for compare)
    function toggleSelect(jobId) {
      const idx = state.selectedJobs.indexOf(jobId);
      if (idx >= 0) {
        state.selectedJobs.splice(idx, 1);
      } else if (state.selectedJobs.length < 3) {
        state.selectedJobs.push(jobId);
      }
      saveState();
      render();
    }

    // Toggle expand job
    function toggleExpand(jobId) {
      state.expandedJob = state.expandedJob === jobId ? null : jobId;
      render();
      setTimeout(notifyHeight, 100);
    }

    // Set filter
    function setFilter(type) {
      state.filters.type = state.filters.type === type ? null : type;
      render();
    }

    // Request action from ChatGPT
    function requestAction(action, job) {
      const messages = {
        salary: `Visa lönestatistik för yrket "${job.title}" i ${job.location || 'Sverige'}. Inkludera snittlön, lönespann och jämförelse med andra regioner.`,
        help: `Hjälp mig skriva ett personligt brev för denna tjänst:\n\nTjänst: ${job.title}\nFöretag: ${job.employer}\nPlats: ${job.location}\n\nBeskrivning: ${job.description}\n\nSkriv ett professionellt och engagerande personligt brev.`,
        share: null, // Handled locally
        compare: `Jämför dessa jobb åt mig och ge en rekommendation:\n\n${state.selectedJobs.map((id, i) => {
          const j = state.data.jobs.find(x => x.id === id);
          return j ? `Jobb ${i + 1}: ${j.title} på ${j.employer} i ${j.location}` : '';
        }).join('\n')}`,
        market: `Ge mig arbetsmarknadsanalys för yrket "${job.title}". Inkludera:\n- Antal lediga tjänster i Sverige\n- Efterfrågan och trender\n- Framtidsutsikter\n- Tips för att sticka ut`,
        cv: `Analysera hur väl mitt CV matchar denna tjänst:\n\nTjänst: ${job.title}\nFöretag: ${job.employer}\n\nBeskrivning: ${job.description}\n\nBe mig klistra in mitt CV för analys.`
      };

      if (action === 'share') {
        if (job.url) {
          navigator.clipboard?.writeText(job.url);
          showToast(t('copied'));
        }
        return;
      }

      if (action === 'apply') {
        window.openai?.openExternal?.({ href: job.url });
        return;
      }

      const message = messages[action];
      if (!message) return;

      // Try multiple methods to send message to ChatGPT
      console.log('=== SMIDRA: Sending message ===');
      console.log('Message:', message.substring(0, 50) + '...');

      // DETAILED DEBUG: What does window.openai contain?
      console.log('window.openai =', window.openai);
      if (window.openai) {
        console.log('Keys:', Object.keys(window.openai));
        console.log('toolOutput:', window.openai.toolOutput);
        console.log('sendMessage:', window.openai.sendMessage);
        console.log('theme:', window.openai.theme);
        for (const key of Object.keys(window.openai)) {
          console.log(`  ${key}:`, typeof window.openai[key], window.openai[key]);
        }
      }

      // Method 1: window.openai.sendFollowUpMessage (correct API!)
      if (typeof window.openai?.sendFollowUpMessage === 'function') {
        try {
          console.log('Calling sendFollowUpMessage...');
          window.openai.sendFollowUpMessage(message);
          showToast('Skickat till ChatGPT!');
          console.log('SUCCESS: sendFollowUpMessage worked');
          return;
        } catch (e) {
          console.log('sendFollowUpMessage failed:', e);
        }
      }

      // Method 1b: Try requestTargetedReply as alternative
      if (typeof window.openai?.requestTargetedReply === 'function') {
        try {
          console.log('Calling requestTargetedReply...');
          window.openai.requestTargetedReply(message);
          showToast('Skickat till ChatGPT!');
          console.log('SUCCESS: requestTargetedReply worked');
          return;
        } catch (e) {
          console.log('requestTargetedReply failed:', e);
        }
      }

      // Method 2: postMessage to parent (ChatGPT window)
      try {
        window.parent.postMessage({
          type: 'chatgpt-plugin-message',
          message: message
        }, '*');
        console.log('Tried postMessage to parent');
      } catch (e) {
        console.log('postMessage failed:', e);
      }

      // Method 3: Try finding ChatGPT's input and injecting text
      try {
        const chatInput = window.parent.document.querySelector('textarea[data-id="root"]');
        if (chatInput) {
          chatInput.value = message;
          chatInput.dispatchEvent(new Event('input', { bubbles: true }));
          showToast('Text ifylld - tryck Enter!');
          console.log('SUCCESS: Injected into chat input');
          return;
        }
      } catch (e) {
        console.log('Input injection failed (expected due to cross-origin):', e.message);
      }

      // Clipboard is blocked by ChatGPT's permissions policy, skip it

      // Final fallback: Show dialog with manual copy
      showMessageDialog(message, action);
    }

    // Show message dialog for copy
    function showMessageDialog(message, action) {
      const titles = {
        salary: '💰 Lönestatistik',
        help: '✍️ Ansökningshjälp',
        market: '📈 Arbetsmarknad',
        compare: '⚖️ Jämför jobb',
        cv: '📄 CV-analys'
      };

      // Remove existing dialog
      document.querySelector('.message-dialog')?.remove();

      const dialog = document.createElement('div');
      dialog.className = 'message-dialog';
      dialog.innerHTML = `
        <div class="dialog-backdrop" onclick="closeDialog()"></div>
        <div class="dialog-content">
          <div class="dialog-header">
            <span>${titles[action] || 'Fråga ChatGPT'}</span>
            <button class="dialog-close" onclick="closeDialog()">✕</button>
          </div>
          <div class="dialog-body">
            <p class="dialog-instruction">Kopiera texten nedan och klistra in i chatten:</p>
            <textarea class="dialog-message" readonly>${message}</textarea>
          </div>
          <div class="dialog-footer">
            <button class="dialog-btn secondary" onclick="closeDialog()">Stäng</button>
            <button class="dialog-btn primary" onclick="copyMessage()">📋 Kopiera</button>
          </div>
        </div>
      `;

      document.body.appendChild(dialog);
      setTimeout(() => dialog.classList.add('open'), 10);
      notifyHeight();

      window.copyMessage = () => {
        const textarea = dialog.querySelector('.dialog-message');
        textarea.select();
        navigator.clipboard?.writeText(message);
        showToast('Kopierat! Klistra in i chatten.');
        closeDialog();
      };

      window.closeDialog = () => {
        dialog.classList.remove('open');
        setTimeout(() => dialog.remove(), 200);
        notifyHeight();
      };
    }

    // Filter jobs
    function getFilteredJobs() {
      let jobs = state.data?.jobs || [];
      if (state.filters.type) {
        jobs = jobs.filter(j => {
          const type = (j.employmentType || '').toLowerCase();
          if (state.filters.type === 'heltid') return type.includes('heltid') || type.includes('full');
          if (state.filters.type === 'deltid') return type.includes('deltid') || type.includes('part');
          return true;
        });
      }
      return jobs;
    }

    // Render
    function render() {
      const app = document.getElementById('app');
      const data = state.data;

      if (!data) {
        app.innerHTML = `
          <div class="loading">
            <div class="spinner"></div>
            <div class="loading-text">${t('results')}...</div>
          </div>`;
        notifyHeight();
        return;
      }

      const jobs = getFilteredJobs();
      const { query, location, total } = data;

      if (!jobs.length) {
        app.innerHTML = `
          <div class="header">
            <div class="header-top">
              <h1 class="header-title">${esc(query)}</h1>
            </div>
            <div class="header-meta">
              <span class="header-meta-item">📍 ${esc(location)}</span>
            </div>
          </div>
          <div class="empty">
            <div class="empty-icon">🔍</div>
            <div class="empty-title">${t('noJobs')}</div>
            <p class="empty-text">${t('tryAgain')}</p>
          </div>`;
        notifyHeight();
        return;
      }

      app.innerHTML = `
        <div class="header">
          <div class="header-top">
            <h1 class="header-title">${esc(query)}</h1>
            <span class="header-badge">${total} ${t('jobs')}</span>
          </div>
          <div class="header-meta">
            <span class="header-meta-item">📍 ${esc(location)}</span>
            <span class="header-meta-item">✨ ${jobs.length} ${t('found')}</span>
          </div>
        </div>

        <div class="filters">
          <button class="filter-btn ${!state.filters.type ? 'active' : ''}" onclick="setFilter(null)">
            ${t('all')}
          </button>
          <button class="filter-btn ${state.filters.type === 'heltid' ? 'active' : ''}" onclick="setFilter('heltid')">
            ${t('fullTime')}
          </button>
          <button class="filter-btn ${state.filters.type === 'deltid' ? 'active' : ''}" onclick="setFilter('deltid')">
            ${t('partTime')}
          </button>
        </div>

        <div class="action-bar">
          <button class="action-btn ${state.savedJobs.length ? '' : 'disabled'}" onclick="showSaved()">
            ❤️ ${t('viewSaved')} ${state.savedJobs.length ? `<span class="count">${state.savedJobs.length}</span>` : ''}
          </button>
          <button class="action-btn ${state.selectedJobs.length >= 2 ? 'primary' : ''}" onclick="compareSelected()" ${state.selectedJobs.length < 2 ? 'disabled' : ''}>
            ⚖️ ${t('compare')} ${state.selectedJobs.length ? `(${state.selectedJobs.length})` : ''}
          </button>
        </div>

        <div class="job-list">
          ${jobs.map(job => {
            const days = daysUntil(job.deadline);
            const isUrgent = days !== null && days >= 0 && days <= 3;
            const isExpired = days !== null && days < 0;
            const isSaved = state.savedJobs.includes(job.id);
            const isSelected = state.selectedJobs.includes(job.id);
            const isExpanded = state.expandedJob === job.id;

            return `
              <article class="job-card ${isSaved ? 'saved' : ''} ${isSelected ? 'selected' : ''} ${isExpanded ? 'expanded' : ''}">
                <div class="job-main">
                  <div class="job-header">
                    <div class="job-select ${isSelected ? 'checked' : ''}" onclick="toggleSelect('${job.id}')">
                      ${isSelected ? '✓' : ''}
                    </div>
                    <div class="job-logo">
                      ${job.logoUrl ? `<img src="${job.logoUrl}" alt="" onerror="this.parentElement.textContent='${initials(job.employer)}'">` : initials(job.employer)}
                    </div>
                    <div class="job-info">
                      <div class="job-employer">${esc(job.employer)}</div>
                      <h2 class="job-title">${esc(job.title)}</h2>
                      <div class="job-tags">
                        <span class="tag location">📍 ${esc(job.location)}</span>
                        ${job.employmentType ? `<span class="tag">${esc(job.employmentType)}</span>` : ''}
                        ${days !== null ? `
                          <span class="tag ${isExpired ? '' : isUrgent ? 'urgent' : 'deadline'}">
                            ${isExpired ? t('expired') : days === 0 ? t('today') : `${days} ${t('daysLeft')}`}
                          </span>
                        ` : ''}
                      </div>
                    </div>
                  </div>

                  <p class="job-description">${esc(job.description)}</p>

                  <div class="job-actions">
                    <button class="job-action save ${isSaved ? 'saved' : ''}" onclick="toggleSave('${job.id}')">
                      ${isSaved ? '❤️' : '🤍'} ${isSaved ? t('saved') : t('save')}
                    </button>
                    <button class="job-action" onclick="toggleExpand('${job.id}')">
                      📋 ${isExpanded ? t('hide') : t('details')}
                    </button>
                    <button class="job-action primary" onclick="requestAction('apply', ${JSON.stringify(job).replace(/"/g, '&quot;')})">
                      🚀 ${t('apply')}
                    </button>
                  </div>
                </div>

                <div class="job-details">
                  <div class="detail-section">
                    <div class="detail-title">📊 ${t('description')}</div>
                    <div class="detail-description">${esc(job.fullDescription || job.description)}</div>
                  </div>

                  <div class="detail-section">
                    <div class="detail-grid">
                      <div class="detail-item">
                        <div class="detail-label">${t('location')}</div>
                        <div class="detail-value">${esc(job.region || job.location)}</div>
                      </div>
                      <div class="detail-item">
                        <div class="detail-label">${t('deadline')}</div>
                        <div class="detail-value">${esc(job.deadline) || '-'}</div>
                      </div>
                      ${job.employmentType ? `
                        <div class="detail-item">
                          <div class="detail-label">${t('type')}</div>
                          <div class="detail-value">${esc(job.employmentType)}</div>
                        </div>
                      ` : ''}
                      ${job.salaryType ? `
                        <div class="detail-item">
                          <div class="detail-label">${t('salaryType')}</div>
                          <div class="detail-value">${esc(job.salaryType)}</div>
                        </div>
                      ` : ''}
                    </div>
                  </div>

                  <div class="detail-actions">
                    <button class="detail-action" onclick="requestAction('salary', ${JSON.stringify(job).replace(/"/g, '&quot;')})">
                      💰 ${t('salary')}
                    </button>
                    <button class="detail-action" onclick="requestAction('help', ${JSON.stringify(job).replace(/"/g, '&quot;')})">
                      ✍️ ${t('help')}
                    </button>
                    <button class="detail-action" onclick="requestAction('market', ${JSON.stringify(job).replace(/"/g, '&quot;')})">
                      📈 Arbetsmarknad
                    </button>
                    <button class="detail-action" onclick="requestAction('share', ${JSON.stringify(job).replace(/"/g, '&quot;')})">
                      🔗 ${t('share')}
                    </button>
                    <button class="detail-action primary" onclick="requestAction('apply', ${JSON.stringify(job).replace(/"/g, '&quot;')})">
                      🚀 ${t('apply')} hos ${esc(job.employer)}
                    </button>
                  </div>
                </div>
              </article>
            `;
          }).join('')}
        </div>
      `;

      notifyHeight();
    }

    // Show saved jobs
    function showSaved() {
      if (state.savedJobs.length === 0) return;
      const savedJobsList = state.savedJobs.map(id => {
        const job = state.data?.jobs?.find(j => j.id === id);
        return job ? `- ${job.title} på ${job.employer}` : '';
      }).filter(Boolean).join('\n');

      if (window.openai?.sendMessage) {
        window.openai.sendMessage(`Här är mina sparade jobb:\n\n${savedJobsList}\n\nHjälp mig välja vilket jobb som passar mig bäst.`);
      }
    }

    // Compare selected jobs
    function compareSelected() {
      if (state.selectedJobs.length < 2) return;
      requestAction('compare', {});
    }

    // Handle data
    function handleData(data) {
      if (!data) return;

      if (data.language) {
        state.language = data.language;
        document.documentElement.lang = data.language;
      }
      if (data.direction) {
        state.direction = data.direction;
        document.documentElement.dir = data.direction;
      }
      if (data.labels) {
        state.labels = { ...defaultLabels, ...data.labels };
      }

      state.data = data;
      render();
    }

    // Initialize
    function init() {
      // Apply theme
      if (window.openai?.theme) {
        document.documentElement.setAttribute('data-theme', window.openai.theme);
      }

      // Restore state
      const saved = window.openai?.widgetState;
      if (saved) {
        state.savedJobs = saved.savedJobs || [];
        state.selectedJobs = saved.selectedJobs || [];
      }

      // Listen for updates
      window.addEventListener('openai:set_globals', () => {
        if (window.openai?.theme) {
          document.documentElement.setAttribute('data-theme', window.openai.theme);
        }
        if (window.openai?.toolOutput) {
          handleData(window.openai.toolOutput);
        }
      });

      // Check for data
      if (window.openai?.toolOutput) {
        handleData(window.openai.toolOutput);
      } else {
        // Preview mode
        fetch('/api/search?q=utvecklare&limit=5')
          .then(r => r.json())
          .then(d => handleData({
            query: 'Utvecklare',
            location: 'Sverige',
            total: d.total,
            jobs: d.jobs,
            labels: defaultLabels
          }))
          .catch(() => {});
      }
    }

    init();
  </script>
</body>
</html>
