<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smidra - Jobbsokning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --smidra-primary: #2563eb;
      --smidra-primary-dark: #1d4ed8;
      --smidra-success: #10b981;
      --smidra-success-dark: #059669;
      --smidra-accent: #8b5cf6;
      --smidra-warning: #f59e0b;
      --bg-gradient-start: #f0f9ff;
      --bg-gradient-end: #e0f2fe;
      --glass: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.9);
      --card-bg: rgba(255, 255, 255, 0.85);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    :root[data-theme="dark"] {
      --bg-gradient-start: #0f172a;
      --bg-gradient-end: #1e293b;
      --glass: rgba(30, 41, 59, 0.8);
      --glass-border: rgba(51, 65, 85, 0.5);
      --card-bg: rgba(30, 41, 59, 0.9);
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: var(--font-main);
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      min-height: 100vh;
      color: var(--text-primary);
      line-height: 1.5;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* Header */
    .header {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      text-align: center;
    }

    .header-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--smidra-primary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .header-query {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .header-location {
      font-size: 14px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .header-stats {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--glass-border);
      font-size: 13px;
      color: var(--text-muted);
    }

    .header-stats strong {
      color: var(--smidra-primary);
      font-weight: 600;
    }

    /* Job Cards */
    .job-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .job-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px;
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .job-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--smidra-primary), var(--smidra-accent));
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .job-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .job-card:hover::before {
      opacity: 1;
    }

    .job-card-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .job-logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--smidra-primary), var(--smidra-accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }

    .job-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }

    .job-info {
      flex: 1;
      min-width: 0;
    }

    .job-employer {
      font-size: 12px;
      font-weight: 500;
      color: var(--smidra-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .job-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .job-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--glass);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .job-meta-item svg {
      width: 14px;
      height: 14px;
      opacity: 0.7;
    }

    .job-description {
      font-size: 13px;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .job-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--smidra-primary), var(--smidra-primary-dark));
      color: white;
    }

    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--smidra-success), var(--smidra-success-dark));
      color: white;
    }

    .btn-success:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }

    .btn-outline {
      background: var(--glass);
      color: var(--text-primary);
      border: 1px solid var(--glass-border);
    }

    .btn-outline:hover {
      background: var(--card-bg);
    }

    /* Deadline badge */
    .deadline-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--smidra-warning);
    }

    .deadline-badge.urgent {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    /* Loading */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      gap: 16px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--glass-border);
      border-top-color: var(--smidra-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .job-card {
      animation: fadeInUp 0.3s ease forwards;
    }

    .job-card:nth-child(1) { animation-delay: 0.05s; }
    .job-card:nth-child(2) { animation-delay: 0.1s; }
    .job-card:nth-child(3) { animation-delay: 0.15s; }
    .job-card:nth-child(4) { animation-delay: 0.2s; }
    .job-card:nth-child(5) { animation-delay: 0.25s; }

    /* Responsive */
    @media (max-width: 440px) {
      .container { padding: 12px; }
      .job-card { padding: 14px; }
      .btn { padding: 8px 12px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="content">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Soker jobb...</div>
      </div>
    </div>
  </div>

  <script>
    // Localization
    const translations = {
      'sv': {
        searchResults: 'Sokresultat',
        jobsFound: 'lediga jobb',
        deadline: 'Sok senast',
        apply: 'Ansok',
        details: 'Visa mer',
        noJobs: 'Inga jobb hittades',
        tryAgain: 'Prova att soka med andra ord',
        loading: 'Soker jobb...',
        inSweden: 'i hela Sverige'
      },
      'en': {
        searchResults: 'Search Results',
        jobsFound: 'jobs found',
        deadline: 'Apply by',
        apply: 'Apply',
        details: 'Details',
        noJobs: 'No jobs found',
        tryAgain: 'Try searching with different keywords',
        loading: 'Searching for jobs...',
        inSweden: 'in all of Sweden'
      }
    };

    let currentLocale = 'sv';
    let currentTheme = 'light';

    function t(key) {
      const lang = currentLocale.startsWith('sv') ? 'sv' : 'en';
      return translations[lang]?.[key] || translations['en'][key];
    }

    function getInitials(name) {
      return name
        .split(' ')
        .slice(0, 2)
        .map(w => w[0])
        .join('')
        .toUpperCase();
    }

    function isDeadlineSoon(deadline) {
      if (!deadline || deadline === 'Lopande') return false;
      const parts = deadline.split('-');
      if (parts.length !== 3) return false;
      const deadlineDate = new Date(parts[0], parts[1] - 1, parts[2]);
      const now = new Date();
      const diffDays = Math.ceil((deadlineDate - now) / (1000 * 60 * 60 * 24));
      return diffDays <= 7 && diffDays >= 0;
    }

    function renderJobs(data) {
      const contentEl = document.getElementById('content');
      const { query, location, total, jobs } = data;

      if (!jobs || jobs.length === 0) {
        contentEl.innerHTML = `
          <div class="header">
            <div class="header-title">${t('searchResults')}</div>
            <div class="header-query">"${query}"</div>
            <div class="header-location">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
              ${location || t('inSweden')}
            </div>
          </div>
          <div class="empty-state">
            <div class="empty-state-icon">🔍</div>
            <div class="empty-state-title">${t('noJobs')}</div>
            <p>${t('tryAgain')}</p>
          </div>
        `;
        notifyHeight();
        return;
      }

      contentEl.innerHTML = `
        <div class="header">
          <div class="header-title">${t('searchResults')}</div>
          <div class="header-query">"${query}"</div>
          <div class="header-location">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            ${location || t('inSweden')}
          </div>
          <div class="header-stats">
            <strong>${total.toLocaleString()}</strong> ${t('jobsFound')}
          </div>
        </div>

        <div class="job-list">
          ${jobs.map(job => `
            <div class="job-card" data-job-id="${job.id}">
              ${isDeadlineSoon(job.deadline) ? `<div class="deadline-badge urgent">⏰ ${job.deadline}</div>` : ''}

              <div class="job-card-header">
                <div class="job-logo">
                  ${job.logoUrl ? `<img src="${job.logoUrl}" alt="${job.employer}" onerror="this.parentElement.innerHTML='${getInitials(job.employer)}'">` : getInitials(job.employer)}
                </div>
                <div class="job-info">
                  <div class="job-employer">${job.employer}</div>
                  <div class="job-title">${job.title}</div>
                </div>
              </div>

              <div class="job-meta">
                <div class="job-meta-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                  </svg>
                  ${job.location}
                </div>
                ${job.deadline && job.deadline !== 'Lopande' ? `
                <div class="job-meta-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                  </svg>
                  ${job.deadline}
                </div>
                ` : ''}
                ${job.occupationField ? `
                <div class="job-meta-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                  </svg>
                  ${job.occupationField}
                </div>
                ` : ''}
              </div>

              <div class="job-description">${job.description}</div>

              <div class="job-actions">
                <button class="btn btn-outline" onclick="showDetails('${job.id}')">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="16" x2="12" y2="12"/>
                    <line x1="12" y1="8" x2="12.01" y2="8"/>
                  </svg>
                  ${t('details')}
                </button>
                <a href="${job.url}" target="_blank" class="btn btn-success" onclick="event.stopPropagation()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                    <polyline points="15 3 21 3 21 9"/>
                    <line x1="10" y1="14" x2="21" y2="3"/>
                  </svg>
                  ${t('apply')}
                </a>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      notifyHeight();
    }

    function showDetails(jobId) {
      // Call the get_job_details tool via ChatGPT
      if (typeof window.openai !== 'undefined' && window.openai.callTool) {
        window.openai.callTool('get_job_details', { jobId });
      } else {
        // Fallback: open in new tab
        window.open(`https://arbetsformedlingen.se/platsbanken/annonser/${jobId}`, '_blank');
      }
    }

    function notifyHeight() {
      if (typeof window.openai !== 'undefined' && window.openai.notifyIntrinsicHeight) {
        requestAnimationFrame(() => {
          window.openai.notifyIntrinsicHeight(document.body.scrollHeight);
        });
      }
    }

    function handleGlobalsUpdate() {
      if (typeof window.openai === 'undefined') return;

      if (window.openai.theme && window.openai.theme !== currentTheme) {
        currentTheme = window.openai.theme;
        document.documentElement.setAttribute('data-theme', currentTheme);
      }

      if (window.openai.locale && window.openai.locale !== currentLocale) {
        currentLocale = window.openai.locale;
        if (window.openai.toolOutput) {
          renderJobs(window.openai.toolOutput);
        }
      }

      if (window.openai.toolOutput) {
        renderJobs(window.openai.toolOutput);
      }
    }

    // Initialize
    if (typeof window.openai !== 'undefined') {
      currentTheme = window.openai.theme || 'light';
      currentLocale = window.openai.locale || 'sv';
      document.documentElement.setAttribute('data-theme', currentTheme);

      window.addEventListener('openai:set_globals', handleGlobalsUpdate, { passive: true });

      if (window.openai.toolOutput) {
        renderJobs(window.openai.toolOutput);
      } else {
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">💼</div>
            <div class="empty-state-title">${t('noJobs')}</div>
          </div>
        `;
        notifyHeight();
      }
    } else {
      // Standalone preview - fetch sample data
      async function fetchPreviewData() {
        try {
          const response = await fetch('/api/search?q=utvecklare&limit=5');
          const data = await response.json();
          renderJobs({
            query: 'utvecklare',
            location: 'Hela Sverige',
            total: data.total,
            jobs: data.jobs
          });
        } catch (error) {
          document.getElementById('content').innerHTML = `
            <div class="header">
              <div class="header-title">Smidra Preview</div>
              <div class="header-query">"utvecklare"</div>
            </div>
            <div class="empty-state">
              <div class="empty-state-icon">🔌</div>
              <div class="empty-state-title">Starta servern</div>
              <p>Kor: node smidra-server.js</p>
            </div>
          `;
        }
      }
      fetchPreviewData();
    }
  </script>
</body>
</html>
