<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smidra - Job Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --bg: #ffffff;
      --surface: #f8fafc;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #0066ff;
      --accent-hover: #0052cc;
      --accent-light: #eff6ff;
      --success: #059669;
      --warning: #d97706;
      --urgent: #dc2626;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-hover: 0 4px 12px rgba(0,0,0,0.08);
      --radius: 8px;
      --radius-lg: 12px;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --border-hover: #475569;
      --text: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --accent-light: #1e3a5f;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html[dir="rtl"] {
      direction: rtl;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Header */
    .header {
      margin-bottom: 16px;
    }

    .header-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    [dir="rtl"] .header-meta {
      flex-direction: row-reverse;
      justify-content: flex-end;
    }

    .header-meta svg {
      width: 14px;
      height: 14px;
      color: var(--text-muted);
    }

    .header-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    [dir="rtl"] .header-meta span {
      flex-direction: row-reverse;
    }

    /* Job List */
    .job-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Job Card */
    .job-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .job-card:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow-hover);
    }

    .job-card.expanded {
      border-color: var(--accent);
    }

    /* Card Header */
    .job-header {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
    }

    [dir="rtl"] .job-header {
      flex-direction: row-reverse;
    }

    .job-logo {
      width: 40px;
      height: 40px;
      border-radius: var(--radius);
      background: var(--accent-light);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
      overflow: hidden;
    }

    .job-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .job-info {
      flex: 1;
      min-width: 0;
      text-align: start;
    }

    .job-employer {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .job-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    /* Tags */
    .job-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    [dir="rtl"] .job-tags {
      flex-direction: row-reverse;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg);
      color: var(--text-secondary);
    }

    [dir="rtl"] .tag {
      flex-direction: row-reverse;
    }

    .tag svg { width: 11px; height: 11px; }
    .tag.location { color: var(--accent); background: var(--accent-light); }
    .tag.deadline { color: var(--warning); background: #fef3c7; }
    .tag.urgent { color: var(--urgent); background: #fee2e2; }
    [data-theme="dark"] .tag.deadline { background: rgba(217, 119, 6, 0.15); }
    [data-theme="dark"] .tag.urgent { background: rgba(220, 38, 38, 0.15); }

    /* Description */
    .job-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 12px;
      text-align: start;
    }

    /* Actions */
    .job-actions {
      display: flex;
      gap: 8px;
    }

    [dir="rtl"] .job-actions {
      flex-direction: row-reverse;
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }

    [dir="rtl"] .btn {
      flex-direction: row-reverse;
    }

    .btn svg { width: 14px; height: 14px; }
    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--surface); border-color: var(--border-hover); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }

    /* Expanded Section */
    .job-expanded {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      animation: slideDown 0.2s ease;
    }

    .job-expanded.show { display: block; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .info-item {
      background: var(--bg);
      padding: 8px 10px;
      border-radius: var(--radius);
      text-align: start;
    }

    .info-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .info-value {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-top: 2px;
    }

    .full-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
      padding: 10px;
      background: var(--bg);
      border-radius: var(--radius);
      text-align: start;
    }

    .full-desc::-webkit-scrollbar { width: 4px; }
    .full-desc::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Empty State */
    .empty {
      text-align: center;
      padding: 40px 20px;
    }

    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .empty-text { font-size: 13px; color: var(--text-muted); }

    /* Loading */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: var(--text-muted); }

    /* Animation */
    .job-card {
      animation: fadeIn 0.25s ease forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .job-card:nth-child(1) { animation-delay: 0.03s; }
    .job-card:nth-child(2) { animation-delay: 0.06s; }
    .job-card:nth-child(3) { animation-delay: 0.09s; }
    .job-card:nth-child(4) { animation-delay: 0.12s; }
    .job-card:nth-child(5) { animation-delay: 0.15s; }

    /* Responsive */
    @media (max-width: 400px) {
      .container { padding: 12px; }
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="app">
      <div class="loading">
        <div class="spinner"></div>
        <div class="loading-text">Searching for jobs...</div>
      </div>
    </div>
  </div>

  <script>
    // Default labels (fallback)
    const defaultLabels = {
      results: 'Search Results',
      found: 'jobs found',
      details: 'Details',
      hide: 'Hide',
      apply: 'Apply',
      noJobs: 'No jobs found',
      tryAgain: 'Try different keywords',
      location: 'Location',
      deadline: 'Apply by',
      type: 'Type',
      salary: 'Salary',
      daysLeft: 'days left',
      today: 'Today!'
    };

    // State
    let state = {
      theme: 'light',
      direction: 'ltr',
      language: 'en',
      labels: defaultLabels,
      expandedJobs: {},
      data: null
    };

    // Get label
    function t(key) {
      return state.labels[key] || defaultLabels[key] || key;
    }

    // Escape HTML
    function esc(text) {
      if (!text) return '';
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    // Get initials
    function initials(name) {
      return name?.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
    }

    // Days until deadline
    function daysLeft(deadline) {
      if (!deadline) return null;
      // Try to parse various date formats
      const dateMatch = deadline.match(/(\d{4})-(\d{2})-(\d{2})/);
      if (!dateMatch) return null;
      const [, y, m, d] = dateMatch.map(Number);
      const date = new Date(y, m - 1, d);
      return Math.ceil((date - new Date()) / 86400000);
    }

    // Apply theme
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      state.theme = theme;
    }

    // Apply direction (RTL/LTR)
    function applyDirection(dir) {
      document.documentElement.setAttribute('dir', dir);
      document.documentElement.lang = state.language;
      state.direction = dir;
    }

    // Notify height
    function notifyHeight() {
      window.openai?.notifyIntrinsicHeight?.(document.body.scrollHeight);
    }

    // Save widget state
    function saveState() {
      window.openai?.setWidgetState?.({ expandedJobs: state.expandedJobs });
    }

    // Restore widget state
    function restoreState() {
      const saved = window.openai?.widgetState;
      if (saved?.expandedJobs) {
        state.expandedJobs = saved.expandedJobs;
      }
    }

    // Toggle job expansion
    function toggleJob(jobId) {
      state.expandedJobs[jobId] = !state.expandedJobs[jobId];
      saveState();
      render();
    }

    // Render jobs
    function render() {
      const app = document.getElementById('app');
      const data = state.data;

      // No data yet - initial loading
      if (!data) {
        app.innerHTML = `
          <div class="loading">
            <div class="spinner"></div>
            <div class="loading-text">${t('results')}...</div>
          </div>`;
        notifyHeight();
        return;
      }

      // Loading state with translated text (while ChatGPT translates)
      if (data.loading) {
        app.innerHTML = `
          <div class="loading">
            <div class="spinner"></div>
            <div class="loading-text">${esc(data.loadingText) || 'Loading...'}</div>
          </div>`;
        notifyHeight();
        return;
      }

      const { query, location, total, jobs } = data;

      if (!jobs?.length) {
        app.innerHTML = `
          <header class="header">
            <span class="header-label">${t('results')}</span>
            <h1 class="header-title">${esc(query)}</h1>
            <div class="header-meta">
              <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>${esc(location)}</span>
            </div>
          </header>
          <div class="empty">
            <div class="empty-icon">🔍</div>
            <div class="empty-title">${t('noJobs')}</div>
            <p class="empty-text">${t('tryAgain')}</p>
          </div>`;
        notifyHeight();
        return;
      }

      app.innerHTML = `
        <header class="header">
          <span class="header-label">${t('results')}</span>
          <h1 class="header-title">${esc(query)}</h1>
          <div class="header-meta">
            <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>${esc(location)}</span>
            <span>${total} ${t('found')}</span>
          </div>
        </header>

        <div class="job-list">
          ${jobs.map(job => {
            const days = daysLeft(job.deadline);
            const isUrgent = days !== null && days <= 7 && days >= 0;
            const isExpanded = state.expandedJobs[job.id];

            return `
            <article class="job-card${isExpanded ? ' expanded' : ''}" data-job-id="${job.id}">
              <div class="job-header">
                <div class="job-logo">
                  ${job.logoUrl
                    ? `<img src="${job.logoUrl}" alt="" onerror="this.parentElement.textContent='${initials(job.employer)}'">`
                    : initials(job.employer)}
                </div>
                <div class="job-info">
                  <div class="job-employer">${esc(job.employer)}</div>
                  <h2 class="job-title">${esc(job.title)}</h2>
                </div>
              </div>

              <div class="job-tags">
                <span class="tag location">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                  ${esc(job.location)}
                </span>
                ${job.workingHours ? `<span class="tag">${esc(job.workingHours)}</span>` : ''}
                ${job.deadline ? `
                  <span class="tag ${isUrgent ? 'urgent' : 'deadline'}">
                    ${isUrgent
                      ? (days <= 0 ? `⚡ ${t('today')}` : `⚡ ${days} ${t('daysLeft')}`)
                      : job.deadline}
                  </span>` : ''}
              </div>

              <p class="job-desc">${esc(job.description?.substring(0, 140))}...</p>

              <div class="job-actions">
                <button class="btn btn-secondary" data-toggle="${job.id}">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    ${isExpanded
                      ? '<path d="M18 15l-6-6-6 6"/>'
                      : '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>'}
                  </svg>
                  ${isExpanded ? t('hide') : t('details')}
                </button>
                <a href="${job.url}" target="_blank" rel="noopener" class="btn btn-primary" data-external="${job.url}">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                    <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                  </svg>
                  ${t('apply')}
                </a>
              </div>

              <div class="job-expanded${isExpanded ? ' show' : ''}" id="exp-${job.id}">
                <div class="info-grid">
                  <div class="info-item">
                    <div class="info-label">${t('location')}</div>
                    <div class="info-value">${esc(job.region || job.location)}</div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">${t('deadline')}</div>
                    <div class="info-value">${job.deadline || '-'}</div>
                  </div>
                  ${job.employmentType ? `
                  <div class="info-item">
                    <div class="info-label">${t('type')}</div>
                    <div class="info-value">${esc(job.employmentType)}</div>
                  </div>` : ''}
                  ${job.salaryType ? `
                  <div class="info-item">
                    <div class="info-label">${t('salary')}</div>
                    <div class="info-value">${esc(job.salaryType)}</div>
                  </div>` : ''}
                </div>
                <div class="full-desc">${esc(job.fullDescription || job.description || '')}</div>
              </div>
            </article>`;
          }).join('')}
        </div>`;

      notifyHeight();
    }

    // Handle clicks
    function handleClick(e) {
      // Toggle button
      const toggle = e.target.closest('[data-toggle]');
      if (toggle) {
        e.preventDefault();
        toggleJob(toggle.dataset.toggle);
        return;
      }

      // External link - use openai.openExternal if available
      const external = e.target.closest('[data-external]');
      if (external && window.openai?.openExternal) {
        e.preventDefault();
        window.openai.openExternal({ href: external.dataset.external });
      }
    }

    // Handle data from ChatGPT
    function handleData(rawData) {
      console.log('[Smidra] Raw data type:', typeof rawData);
      console.log('[Smidra] Raw data:', JSON.stringify(rawData, null, 2));

      if (!rawData) {
        console.log('[Smidra] No data received');
        return;
      }

      // Try to extract data from different possible structures
      let data = rawData;

      // If it's a string, try to parse it
      if (typeof rawData === 'string') {
        try {
          data = JSON.parse(rawData);
          console.log('[Smidra] Parsed string data');
        } catch (e) {
          console.log('[Smidra] Could not parse string:', e);
          return;
        }
      }

      // Check for nested structures (e.g., data.content, data.result, etc.)
      if (data.structuredContent) {
        data = data.structuredContent;
        console.log('[Smidra] Using structuredContent');
      } else if (data.content && !data.jobs) {
        data = data.content;
        console.log('[Smidra] Using content property');
      }

      console.log('[Smidra] Final data keys:', Object.keys(data));
      console.log('[Smidra] Jobs count:', data.jobs?.length || 0);
      console.log('[Smidra] Query:', data.query);
      console.log('[Smidra] Location:', data.location);

      // Apply language settings
      if (data.language) {
        state.language = data.language;
        document.documentElement.lang = data.language;
        console.log('[Smidra] Language set to:', data.language);
      }

      // Apply direction (RTL for Arabic, Hebrew, etc.)
      if (data.direction) {
        applyDirection(data.direction);
        console.log('[Smidra] Direction set to:', data.direction);
      }

      // Apply labels
      if (data.labels) {
        state.labels = { ...defaultLabels, ...data.labels };
        console.log('[Smidra] Labels applied:', Object.keys(data.labels).length, 'labels');
      }

      // Store data and render
      state.data = data;
      render();
    }

    // Handle globals from ChatGPT
    function handleGlobals(event) {
      console.log('[Smidra] openai:set_globals event received');
      console.log('[Smidra] window.openai exists:', !!window.openai);

      if (!window.openai) return;

      console.log('[Smidra] window.openai keys:', Object.keys(window.openai));
      console.log('[Smidra] toolOutput exists:', !!window.openai.toolOutput);
      console.log('[Smidra] toolOutput type:', typeof window.openai.toolOutput);

      if (window.openai.theme) applyTheme(window.openai.theme);
      if (window.openai.toolOutput) {
        handleData(window.openai.toolOutput);
      }
    }

    // Initialize
    function init() {
      console.log('[Smidra] Widget initializing...');
      console.log('[Smidra] window.openai exists at init:', !!window.openai);

      // Set up event listener
      window.addEventListener('openai:set_globals', handleGlobals, { passive: true });
      document.getElementById('app').addEventListener('click', handleClick);

      if (window.openai) {
        console.log('[Smidra] window.openai keys at init:', Object.keys(window.openai));
        console.log('[Smidra] toolOutput at init:', !!window.openai.toolOutput);

        // Apply initial theme
        if (window.openai.theme) applyTheme(window.openai.theme);

        // Restore saved state
        restoreState();

        // Check for data
        if (window.openai.toolOutput) {
          console.log('[Smidra] Found toolOutput immediately');
          handleData(window.openai.toolOutput);
        } else {
          console.log('[Smidra] No toolOutput yet, polling...');
          // Poll for data with better logging
          let pollCount = 0;
          const check = setInterval(() => {
            pollCount++;
            if (window.openai?.toolOutput) {
              console.log('[Smidra] Found toolOutput after', pollCount, 'polls');
              clearInterval(check);
              handleData(window.openai.toolOutput);
            }
          }, 50);
          setTimeout(() => {
            clearInterval(check);
            console.log('[Smidra] Polling timed out after', pollCount, 'polls');
            if (!state.data) {
              console.log('[Smidra] No data received - showing fallback');
            }
          }, 10000);
        }
      } else {
        console.log('[Smidra] No window.openai - preview mode');
        // Preview mode - fetch sample data
        fetch('/api/search?q=utvecklare&limit=5')
          .then(r => r.json())
          .then(d => {
            handleData({
              language: 'sv',
              direction: 'ltr',
              query: 'utvecklare',
              location: 'Hela Sverige',
              total: d.total,
              jobs: d.jobs,
              labels: {
                results: 'Sökresultat',
                found: 'jobb hittade',
                details: 'Visa mer',
                hide: 'Dölj',
                apply: 'Ansök',
