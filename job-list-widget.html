<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smidra - Jobbsokning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;

      /* Brand Colors */
      --brand-primary: #6366f1;
      --brand-primary-light: #818cf8;
      --brand-secondary: #ec4899;
      --brand-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);

      /* Semantic Colors */
      --success: #10b981;
      --success-light: #d1fae5;
      --warning: #f59e0b;
      --warning-light: #fef3c7;
      --urgent: #ef4444;
      --urgent-light: #fee2e2;

      /* Light Theme */
      --bg-primary: #fafbfc;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --border-light: #f1f5f9;

      /* Effects */
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
      --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.15);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
    }

    :root[data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --border: #334155;
      --border-light: #1e293b;
      --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-main);
      background: var(--bg-primary);
      min-height: 100vh;
      color: var(--text-primary);
      line-height: 1.6;
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Header */
    .header {
      background: var(--bg-secondary);
      border-radius: var(--radius-xl);
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid var(--border-light);
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--brand-gradient);
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-tertiary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: var(--brand-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .header-badge svg {
      width: 14px;
      height: 14px;
    }

    .header-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .header-subtitle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .header-subtitle svg {
      width: 16px;
      height: 16px;
      color: var(--brand-primary);
    }

    .header-stats {
      display: flex;
      gap: 16px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-light);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Job List */
    .job-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Job Card - Redesigned */
    .job-card {
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .job-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--brand-primary);
    }

    .job-card:hover .job-card-accent {
      width: 100%;
    }

    .job-card-accent {
      position: absolute;
      top: 0;
      left: 0;
      height: 3px;
      width: 0;
      background: var(--brand-gradient);
      transition: width 0.3s ease;
    }

    .job-card-inner {
      padding: 20px;
    }

    /* Card Header */
    .job-card-header {
      display: flex;
      gap: 14px;
      margin-bottom: 14px;
    }

    .job-logo {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      background: var(--brand-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .job-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .job-logo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
    }

    .job-header-content {
      flex: 1;
      min-width: 0;
    }

    .job-employer {
      font-size: 12px;
      font-weight: 600;
      color: var(--brand-primary);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .job-employer-verified {
      width: 14px;
      height: 14px;
      background: var(--success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .job-employer-verified svg {
      width: 8px;
      height: 8px;
      color: white;
    }

    .job-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Tags Row */
    .job-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .job-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
    }

    .job-tag svg {
      width: 12px;
      height: 12px;
      opacity: 0.7;
    }

    .job-tag.location {
      background: rgba(99, 102, 241, 0.1);
      color: var(--brand-primary);
    }

    .job-tag.field {
      background: rgba(236, 72, 153, 0.1);
      color: var(--brand-secondary);
    }

    .job-tag.deadline {
      background: var(--warning-light);
      color: #b45309;
    }

    .job-tag.urgent {
      background: var(--urgent-light);
      color: var(--urgent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Description */
    .job-description {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 16px;
    }

    /* Card Footer */
    .job-card-footer {
      display: flex;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--border-light);
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    .btn-primary {
      background: var(--brand-gradient);
      color: white;
    }

    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: var(--shadow-glow);
    }

    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border-light);
      border-color: var(--brand-primary);
    }

    /* Expandable Details */
    .job-details-expanded {
      display: none;
      padding-top: 16px;
      margin-top: 16px;
      border-top: 1px solid var(--border-light);
      animation: expandIn 0.3s ease;
    }

    .job-details-expanded.show {
      display: block;
    }

    @keyframes expandIn {
      from { opacity: 0; max-height: 0; }
      to { opacity: 1; max-height: 1000px; }
    }

    .job-full-description {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.7;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
      padding: 14px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
      margin-bottom: 16px;
    }

    .job-full-description::-webkit-scrollbar {
      width: 6px;
    }

    .job-full-description::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .job-info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .job-info-item {
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      padding: 12px;
    }

    .job-info-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .job-info-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .btn-expand {
      background: transparent;
      color: var(--brand-primary);
      border: 1px solid var(--brand-primary);
    }

    .btn-expand:hover {
      background: rgba(99, 102, 241, 0.1);
    }

    .btn-expand.active {
      background: var(--brand-primary);
      color: white;
    }

    /* Quick Info Chips */
    .job-quick-info {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
    }

    .quick-info-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .quick-info-item svg {
      width: 14px;
      height: 14px;
      color: var(--text-muted);
    }

    /* Loading & Empty States */
    .loading, .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      text-align: center;
      padding: 40px 20px;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--brand-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-icon {
      width: 80px;
      height: 80px;
      background: var(--bg-tertiary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 20px;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .empty-text {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Animations */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .job-card {
      animation: slideUp 0.4s ease forwards;
      opacity: 0;
    }

    .job-card:nth-child(1) { animation-delay: 0.05s; }
    .job-card:nth-child(2) { animation-delay: 0.1s; }
    .job-card:nth-child(3) { animation-delay: 0.15s; }
    .job-card:nth-child(4) { animation-delay: 0.2s; }
    .job-card:nth-child(5) { animation-delay: 0.25s; }
    .job-card:nth-child(6) { animation-delay: 0.3s; }

    /* Responsive */
    @media (max-width: 400px) {
      .container { padding: 12px; }
      .header { padding: 20px; }
      .job-card-inner { padding: 16px; }
      .job-title { font-size: 15px; }
      .btn { padding: 10px 12px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="content">
      <div class="loading">
        <div class="loading-spinner"></div>
        <span style="color: var(--text-muted)">Soker jobb...</span>
      </div>
    </div>
  </div>

  <script>
    const translations = {
      'sv': {
        searchResults: 'Sökresultat',
        jobsFound: 'lediga jobb',
        showing: 'Visar',
        deadline: 'Sök senast',
        apply: 'Ansök',
        details: 'Mer info',
        hideDetails: 'Dölj',
        noJobs: 'Inga jobb hittades',
        tryAgain: 'Prova att söka med andra ord',
        urgent: 'Snart!',
        allSweden: 'Hela Sverige',
        location: 'Plats',
        employment: 'Anställning',
        salary: 'Lön'
      },
      'en': {
        searchResults: 'Search Results',
        jobsFound: 'jobs available',
        showing: 'Showing',
        deadline: 'Apply by',
        apply: 'Apply',
        details: 'Details',
        hideDetails: 'Hide',
        noJobs: 'No jobs found',
        tryAgain: 'Try different search terms',
        urgent: 'Soon!',
        allSweden: 'All Sweden',
        location: 'Location',
        employment: 'Employment',
        salary: 'Salary'
      }
    };

    let currentLocale = 'sv';
    let currentTheme = 'light';

    function t(key) {
      const lang = currentLocale.startsWith('sv') ? 'sv' : 'en';
      return translations[lang]?.[key] || translations['en'][key];
    }

    function getInitials(name) {
      return name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
    }

    function getDaysUntilDeadline(deadline) {
      if (!deadline || deadline === 'Lopande') return null;
      const parts = deadline.split('-');
      if (parts.length !== 3) return null;
      const deadlineDate = new Date(parts[0], parts[1] - 1, parts[2]);
      return Math.ceil((deadlineDate - new Date()) / (1000 * 60 * 60 * 24));
    }

    function formatDeadline(deadline) {
      const days = getDaysUntilDeadline(deadline);
      if (days === null) return deadline;
      if (days <= 0) return 'Idag!';
      if (days === 1) return 'Imorgon';
      if (days <= 7) return `${days} dagar`;
      return deadline;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function truncateText(text, maxLength = 120) {
      if (!text || text.length <= maxLength) return text || '';
      return text.substring(0, maxLength).trim() + '...';
    }

    function renderJobs(data) {
      const contentEl = document.getElementById('content');
      const { query, location, total, jobs } = data;

      if (!jobs || jobs.length === 0) {
        contentEl.innerHTML = `
          <div class="header">
            <div class="header-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
              </svg>
              ${t('searchResults')}
            </div>
            <div class="header-title">"${query}"</div>
            <div class="header-subtitle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
              </svg>
              ${location || t('allSweden')}
            </div>
          </div>
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <div class="empty-title">${t('noJobs')}</div>
            <p class="empty-text">${t('tryAgain')}</p>
          </div>
        `;
        notifyHeight();
        return;
      }

      contentEl.innerHTML = `
        <div class="header">
          <div class="header-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
            </svg>
            ${t('searchResults')}
          </div>
          <div class="header-title">"${query}"</div>
          <div class="header-subtitle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
            </svg>
            ${location || t('allSweden')}
          </div>
          <div class="header-stats">
            <div class="stat-item">
              <span class="stat-value">${total.toLocaleString()}</span>
              <span class="stat-label">${t('jobsFound')}</span>
            </div>
            <div class="stat-item">
              <span class="stat-value">${jobs.length}</span>
              <span class="stat-label">${t('showing')}</span>
            </div>
          </div>
        </div>

        <div class="job-list">
          ${jobs.map(job => {
            const daysLeft = getDaysUntilDeadline(job.deadline);
            const isUrgent = daysLeft !== null && daysLeft <= 7;

            return `
            <div class="job-card">
              <div class="job-card-accent"></div>
              <div class="job-card-inner">
                <div class="job-card-header">
                  <div class="job-logo">
                    ${job.logoUrl
                      ? `<img src="${job.logoUrl}" alt="${job.employer}" onerror="this.parentElement.innerHTML='${getInitials(job.employer)}'">`
                      : getInitials(job.employer)
                    }
                  </div>
                  <div class="job-header-content">
                    <div class="job-employer">
                      ${job.employer}
                      ${job.logoUrl ? `
                      <span class="job-employer-verified" title="Verifierad arbetsgivare">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                          <polyline points="20 6 9 17 4 12"/>
                        </svg>
                      </span>
                      ` : ''}
                    </div>
                    <div class="job-title">${escapeHtml(job.title)}</div>
                  </div>
                </div>

                <div class="job-tags">
                  <span class="job-tag location">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                    </svg>
                    ${job.location}
                  </span>
                  ${job.occupationField ? `
                  <span class="job-tag field">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v3"/>
                    </svg>
                    ${job.occupationField}
                  </span>
                  ` : ''}
                  ${job.deadline && job.deadline !== 'Lopande' ? `
                  <span class="job-tag ${isUrgent ? 'urgent' : 'deadline'}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                    ${isUrgent ? formatDeadline(job.deadline) : job.deadline}
                  </span>
                  ` : ''}
                </div>

                <div class="job-quick-info">
                  ${job.workingHours ? `
                  <div class="quick-info-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                    ${job.workingHours}
                  </div>
                  ` : ''}
                  ${job.employmentType ? `
                  <div class="quick-info-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                    </svg>
                    ${job.employmentType.replace('Vanlig anstallning', 'Fast')}
                  </div>
                  ` : ''}
                </div>

                <div class="job-description">${escapeHtml(truncateText(job.description, 140))}</div>

                <div class="job-card-footer">
                  <button class="btn btn-expand" data-job-id="${job.id}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
                    </svg>
                    <span class="btn-text">${t('details')}</span>
                  </button>
                  <a href="${job.url}" target="_blank" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                      <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                    </svg>
                    ${t('apply')}
                  </a>
                </div>

                <!-- Expandable Details -->
                <div class="job-details-expanded" id="details-${job.id}">
                  <div class="job-info-grid">
                    <div class="job-info-item">
                      <div class="job-info-label">${t('location')}</div>
                      <div class="job-info-value">${job.location}${job.region ? ', ' + job.region : ''}</div>
                    </div>
                    <div class="job-info-item">
                      <div class="job-info-label">${t('deadline')}</div>
                      <div class="job-info-value">${job.deadline || 'Löpande'}</div>
                    </div>
                    ${job.employmentType ? `
                    <div class="job-info-item">
                      <div class="job-info-label">${t('employment')}</div>
                      <div class="job-info-value">${job.employmentType.replace('Vanlig anställning', 'Fast tjänst')}</div>
                    </div>
                    ` : ''}
                    ${job.salaryType ? `
                    <div class="job-info-item">
                      <div class="job-info-label">${t('salary')}</div>
                      <div class="job-info-value">${job.salaryType.replace('Fast månads- vecko- eller timlön', 'Månadslön')}</div>
                    </div>
                    ` : ''}
                  </div>
                  <div class="job-full-description">${escapeHtml(job.fullDescription || job.description || 'Ingen beskrivning tillgänglig.')}</div>
                </div>
              </div>
            </div>
          `}).join('')}
        </div>
      `;

      notifyHeight();
    }

    function handleContentClick(event) {
      // Check if expand button was clicked
      const expandBtn = event.target.closest('.btn-expand');
      if (expandBtn) {
        event.preventDefault();
        event.stopPropagation();
        const jobId = expandBtn.dataset.jobId;
        if (jobId) {
          toggleDetails(jobId, expandBtn);
        }
      }
    }

    function toggleDetails(jobId, btnEl) {
      const detailsEl = document.getElementById(`details-${jobId}`);

      if (detailsEl && btnEl) {
        const isExpanded = detailsEl.classList.toggle('show');
        btnEl.classList.toggle('active', isExpanded);
        const textEl = btnEl.querySelector('.btn-text');
        if (textEl) {
          textEl.textContent = isExpanded ? t('hideDetails') : t('details');
        }
        notifyHeight();
      }
    }

    function notifyHeight() {
      if (typeof window.openai !== 'undefined' && window.openai.notifyIntrinsicHeight) {
        requestAnimationFrame(() => {
          window.openai.notifyIntrinsicHeight(document.body.scrollHeight);
        });
      }
    }

    function handleGlobalsUpdate() {
      if (typeof window.openai === 'undefined') return;

      if (window.openai.theme && window.openai.theme !== currentTheme) {
        currentTheme = window.openai.theme;
        document.documentElement.setAttribute('data-theme', currentTheme);
      }

      if (window.openai.locale) currentLocale = window.openai.locale;
      if (window.openai.toolOutput) renderJobs(window.openai.toolOutput);
    }

    // Initialize
    if (typeof window.openai !== 'undefined') {
      currentTheme = window.openai.theme || 'light';
      currentLocale = window.openai.locale || 'sv';
      document.documentElement.setAttribute('data-theme', currentTheme);
      window.addEventListener('openai:set_globals', handleGlobalsUpdate, { passive: true });

      if (window.openai.toolOutput) {
        renderJobs(window.openai.toolOutput);
      }
    } else {
      // Standalone preview
      async function fetchPreview() {
        try {
          const res = await fetch('/api/search?q=utvecklare&limit=5');
          const data = await res.json();
          renderJobs({ query: 'utvecklare', location: 'Hela Sverige', total: data.total, jobs: data.jobs });
        } catch (e) {
          document.getElementById('content').innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">🔌</div>
              <div class="empty-title">Starta servern</div>
              <p class="empty-text">node smidra-server.js</p>
            </div>
          `;
        }
      }
      fetchPreview();
    }

    // Set up global event delegation for clicks (works in ChatGPT sandbox)
    document.getElementById('content').addEventListener('click', handleContentClick);
  </script>
</body>
</html>
