<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smidra - Jobsearch</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #1a1a2e;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    /* Glass card */
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.1),
        0 2px 8px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    /* Header */
    .header {
      padding: 24px 28px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .header-title {
      font-size: 13px;
      font-weight: 600;
      color: #6366f1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-count {
      font-size: 13px;
      color: #64748b;
    }

    .search-info {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-top: 4px;
    }

    .search-location {
      font-size: 15px;
      color: #64748b;
      margin-top: 2px;
    }

    /* Filter tabs */
    .filters {
      display: flex;
      gap: 8px;
      padding: 16px 28px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      background: rgba(0, 0, 0, 0.02);
    }

    .filter-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      background: transparent;
      color: #64748b;
    }

    .filter-btn:hover {
      background: rgba(99, 102, 241, 0.1);
      color: #6366f1;
    }

    .filter-btn.active {
      background: #6366f1;
      color: white;
    }

    /* Job list */
    .job-list {
      padding: 8px 0;
    }

    .job-item {
      padding: 20px 28px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .job-item:last-child {
      border-bottom: none;
    }

    .job-item:hover {
      background: rgba(99, 102, 241, 0.04);
    }

    .job-item.expanded {
      background: rgba(99, 102, 241, 0.06);
    }

    .job-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .job-content {
      flex: 1;
      min-width: 0;
    }

    .job-title {
      font-size: 16px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .job-company {
      font-size: 14px;
      color: #475569;
      margin-bottom: 8px;
    }

    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
      color: #64748b;
    }

    .job-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .job-meta-icon {
      width: 14px;
      height: 14px;
      opacity: 0.6;
    }

    .job-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .job-type {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.1);
      color: #6366f1;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .save-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .save-btn:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    .save-btn.saved {
      color: #ef4444;
    }

    .save-btn svg {
      width: 20px;
      height: 20px;
    }

    /* Expanded job details */
    .job-details {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
    }

    .job-item.expanded .job-details {
      display: block;
    }

    .job-description {
      font-size: 14px;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 16px;
    }

    .job-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: #6366f1;
      color: white;
    }

    .btn-primary:hover {
      background: #4f46e5;
    }

    .btn-secondary {
      background: rgba(0, 0, 0, 0.05);
      color: #475569;
    }

    .btn-secondary:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      padding: 20px 28px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
    }

    .page-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      background: transparent;
      color: #64748b;
    }

    .page-btn:hover {
      background: rgba(99, 102, 241, 0.1);
      color: #6366f1;
    }

    .page-btn.active {
      background: #6366f1;
      color: white;
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-dots {
      padding: 0 4px;
      color: #94a3b8;
    }

    /* Empty state */
    .empty-state {
      padding: 60px 28px;
      text-align: center;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      opacity: 0.3;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .empty-text {
      font-size: 14px;
      color: #64748b;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      gap: 12px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 15px;
      color: #64748b;
    }

    /* RTL Support */
    [dir="rtl"] .job-main { flex-direction: row-reverse; }
    [dir="rtl"] .job-meta { flex-direction: row-reverse; }
    [dir="rtl"] .job-actions { align-items: flex-start; }
    [dir="rtl"] .header-top { flex-direction: row-reverse; }
  </style>
</head>
<body>
  <div class="container">
    <div class="glass-card" id="app">
      <div class="loading">
        <div class="spinner"></div>
        <span class="loading-text">Laddar jobb...</span>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const JOBS_PER_PAGE = 10;

    const state = {
      data: null,
      language: 'sv',
      direction: 'ltr',
      currentPage: 1,
      expandedJob: null,
      savedJobs: [],
      filter: 'all'
    };

    const defaultLabels = {
      results: 'Sökresultat',
      jobs: 'jobb',
      inLocation: 'i',
      allJobs: 'Alla',
      fullTime: 'Heltid',
      partTime: 'Deltid',
      location: 'Plats',
      deadline: 'Sök senast',
      apply: 'Ansök nu',
      salary: 'Lönestatistik',
      coverLetter: 'Personligt brev',
      market: 'Marknadsanalys',
      share: 'Dela',
      saved: 'Sparad',
      save: 'Spara',
      noJobs: 'Inga jobb hittades',
      tryAgain: 'Försök med andra sökord',
      page: 'Sida',
      previous: 'Föregående',
      next: 'Nästa'
    };

    function t(key) {
      return state.data?.labels?.[key] || defaultLabels[key] || key;
    }

    function esc(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function notifyHeight() {
      setTimeout(() => {
        window.openai?.notifyIntrinsicHeight?.(document.body.scrollHeight);
      }, 50);
    }

    function saveState() {
      window.openai?.setWidgetState?.({ savedJobs: state.savedJobs });
    }

    function toggleSave(jobId, e) {
      e.stopPropagation();
      const idx = state.savedJobs.indexOf(jobId);
      if (idx >= 0) {
        state.savedJobs.splice(idx, 1);
      } else {
        state.savedJobs.push(jobId);
      }
      saveState();
      render();
    }

    function toggleExpand(jobId) {
      state.expandedJob = state.expandedJob === jobId ? null : jobId;
      render();
      notifyHeight();
    }

    function setFilter(filter) {
      state.filter = filter;
      state.currentPage = 1;
      render();
    }

    function setPage(page) {
      state.currentPage = page;
      state.expandedJob = null;
      render();
      notifyHeight();
      // Scroll to top of widget
      document.querySelector('.glass-card')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function getFilteredJobs() {
      let jobs = state.data?.jobs || [];
      if (state.filter === 'fulltime') {
        jobs = jobs.filter(j => {
          const type = (j.employmentType || '').toLowerCase();
          return type.includes('heltid') || type.includes('full');
        });
      } else if (state.filter === 'parttime') {
        jobs = jobs.filter(j => {
          const type = (j.employmentType || '').toLowerCase();
          return type.includes('deltid') || type.includes('part');
        });
      }
      return jobs;
    }

    function requestAction(action, job, e) {
      e?.stopPropagation();

      if (action === 'apply') {
        window.openai?.openExternal?.({ href: job.url });
        return;
      }

      if (action === 'share') {
        const text = `${job.title} - ${job.employer}\n${job.url}`;
        if (navigator.share) {
          navigator.share({ title: job.title, text: text, url: job.url });
        } else {
          showToast('Länk: ' + job.url);
        }
        return;
      }

      const lang = state.language || 'sv';
      let message = '';

      switch (action) {
        case 'salary':
          message = `Användaren vill se lönestatistik för denna tjänst:

TJÄNST:
- Titel: ${job.title}
- Företag: ${job.employer}
- Plats: ${job.location || 'Sverige'}
- Typ: ${job.employmentType || 'Ej angivet'}

INSTRUKTION:
1. Sök på nätet efter aktuell lönestatistik för "${job.title}" i ${job.location || 'Sverige'}
2. Hitta: genomsnittslön, lönespann (min/max), junior vs senior nivåer
3. När du hittat informationen, anropa display_salary verktyget med datan
4. Inkludera källor och förhandlingstips

Svara på användarens språk (${lang}).`;
          break;

        case 'help':
          message = `Användaren vill ha hjälp att skriva ett personligt brev för denna tjänst:

TJÄNST:
- Titel: ${job.title}
- Företag: ${job.employer}
- Plats: ${job.location || 'Sverige'}
- Beskrivning: ${job.description?.substring(0, 300) || 'Ej angivet'}

Skriv ett professionellt, engagerande personligt brev. Fråga användaren om deras bakgrund och erfarenhet för att anpassa brevet bättre.

Svara på användarens språk (${lang}).`;
          break;

        case 'market':
          message = `Ge mig arbetsmarknadsanalys för yrket "${job.title}" i ${job.location || 'Sverige'}.

Sök på nätet och inkludera:
- Antal lediga tjänster just nu
- Efterfrågan och trender
- Framtidsutsikter
- Vilka kompetenser som efterfrågas
- Tips för att sticka ut

Svara på användarens språk (${lang}).`;
          break;
      }

      if (message && window.openai?.sendFollowUpMessage) {
        showToast('Skickar...');
        window.openai.sendFollowUpMessage({ prompt: message });
      }
    }

    function render() {
      const app = document.getElementById('app');
      const d = state.data;

      if (!d || !d.jobs) {
        app.innerHTML = `
          <div class="loading">
            <div class="spinner"></div>
            <span class="loading-text">Laddar jobb...</span>
          </div>
        `;
        return;
      }

      const filteredJobs = getFilteredJobs();
      const totalPages = Math.ceil(filteredJobs.length / JOBS_PER_PAGE);
      const startIdx = (state.currentPage - 1) * JOBS_PER_PAGE;
      const pageJobs = filteredJobs.slice(startIdx, startIdx + JOBS_PER_PAGE);

      if (filteredJobs.length === 0) {
        app.innerHTML = `
          <div class="header">
            <div class="header-top">
              <span class="header-title">${esc(t('results'))}</span>
            </div>
            <div class="search-info">${esc(d.query || 'Jobb')}</div>
            ${d.location ? `<div class="search-location">${t('inLocation')} ${esc(d.location)}</div>` : ''}
          </div>
          <div class="empty-state">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <div class="empty-title">${esc(t('noJobs'))}</div>
            <div class="empty-text">${esc(t('tryAgain'))}</div>
          </div>
        `;
        notifyHeight();
        return;
      }

      app.innerHTML = `
        <div class="header">
          <div class="header-top">
            <span class="header-title">${esc(t('results'))}</span>
            <span class="header-count">${filteredJobs.length} ${t('jobs')}</span>
          </div>
          <div class="search-info">${esc(d.query || 'Jobb')}</div>
          ${d.location ? `<div class="search-location">${t('inLocation')} ${esc(d.location)}</div>` : ''}
        </div>

        <div class="filters">
          <button class="filter-btn ${state.filter === 'all' ? 'active' : ''}" onclick="setFilter('all')">
            ${t('allJobs')}
          </button>
          <button class="filter-btn ${state.filter === 'fulltime' ? 'active' : ''}" onclick="setFilter('fulltime')">
            ${t('fullTime')}
          </button>
          <button class="filter-btn ${state.filter === 'parttime' ? 'active' : ''}" onclick="setFilter('parttime')">
            ${t('partTime')}
          </button>
        </div>

        <div class="job-list">
          ${pageJobs.map(job => {
            const isExpanded = state.expandedJob === job.id;
            const isSaved = state.savedJobs.includes(job.id);

            return `
              <div class="job-item ${isExpanded ? 'expanded' : ''}" onclick="toggleExpand('${job.id}')">
                <div class="job-main">
                  <div class="job-content">
                    <div class="job-title">${esc(job.title)}</div>
                    <div class="job-company">${esc(job.employer)}</div>
                    <div class="job-meta">
                      <span class="job-meta-item">
                        <svg class="job-meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                          <path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                          <path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        ${esc(job.location || 'Sverige')}
                      </span>
                      ${job.deadline ? `
                        <span class="job-meta-item">
                          <svg class="job-meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                          </svg>
                          ${esc(job.deadline)}
                        </span>
                      ` : ''}
                    </div>
                  </div>
                  <div class="job-actions">
                    ${job.employmentType ? `<span class="job-type">${esc(job.employmentType)}</span>` : ''}
                    <button class="save-btn ${isSaved ? 'saved' : ''}" onclick="toggleSave('${job.id}', event)" title="${isSaved ? t('saved') : t('save')}">
                      <svg viewBox="0 0 24 24" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
                      </svg>
                    </button>
                  </div>
                </div>

                <div class="job-details">
                  <p class="job-description">${esc(job.description)}</p>
                  <div class="job-buttons">
                    <button class="btn btn-primary" onclick="requestAction('apply', ${JSON.stringify(job).replace(/"/g, '&quot;')}, event)">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                        <polyline points="15 3 21 3 21 9"/>
                        <line x1="10" y1="14" x2="21" y2="3"/>
                      </svg>
                      ${t('apply')}
                    </button>
                    <button class="btn btn-secondary" onclick="requestAction('salary', ${JSON.stringify(job).replace(/"/g, '&quot;')}, event)">
                      ${t('salary')}
                    </button>
                    <button class="btn btn-secondary" onclick="requestAction('help', ${JSON.stringify(job).replace(/"/g, '&quot;')}, event)">
                      ${t('coverLetter')}
                    </button>
                    <button class="btn btn-secondary" onclick="requestAction('share', ${JSON.stringify(job).replace(/"/g, '&quot;')}, event)">
                      ${t('share')}
                    </button>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        ${totalPages > 1 ? `
          <div class="pagination">
            <button class="page-btn" onclick="setPage(${state.currentPage - 1})" ${state.currentPage === 1 ? 'disabled' : ''}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <polyline points="15 18 9 12 15 6"/>
              </svg>
            </button>

            ${generatePagination(state.currentPage, totalPages)}

            <button class="page-btn" onclick="setPage(${state.currentPage + 1})" ${state.currentPage === totalPages ? 'disabled' : ''}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </button>
          </div>
        ` : ''}
      `;

      notifyHeight();
    }

    function generatePagination(current, total) {
      const pages = [];
      const maxVisible = 5;

      if (total <= maxVisible) {
        for (let i = 1; i <= total; i++) {
          pages.push(i);
        }
      } else {
        if (current <= 3) {
          pages.push(1, 2, 3, 4, '...', total);
        } else if (current >= total - 2) {
          pages.push(1, '...', total - 3, total - 2, total - 1, total);
        } else {
          pages.push(1, '...', current - 1, current, current + 1, '...', total);
        }
      }

      return pages.map(p => {
        if (p === '...') {
          return '<span class="page-dots">...</span>';
        }
        return `<button class="page-btn ${p === current ? 'active' : ''}" onclick="setPage(${p})">${p}</button>`;
      }).join('');
    }

    function handleData(data) {
      if (!data) return;

      if (data.language) {
        state.language = data.language;
        document.documentElement.lang = data.language;
      }
      if (data.direction) {
        state.direction = data.direction;
        document.documentElement.dir = data.direction;
      }

      state.data = data;
      state.currentPage = 1;
      state.expandedJob = null;
      render();
    }

    function init() {
      // Restore saved jobs
      const saved = window.openai?.widgetState;
      if (saved?.savedJobs) {
        state.savedJobs = saved.savedJobs;
      }

      // Listen for data updates
      window.addEventListener('openai:set_globals', () => {
        if (window.openai?.toolOutput) {
          handleData(window.openai.toolOutput);
        }
      });

      // Initial data
      if (window.openai?.toolOutput) {
        handleData(window.openai.toolOutput);
      } else {
        // Preview mode - fetch sample data
        fetch('/api/search?q=utvecklare&limit=25')
          .then(r => r.json())
          .then(d => handleData({
            query: 'Utvecklare',
            location: 'Sverige',
            total: d.total,
            jobs: d.jobs
          }))
          .catch(() => {});
      }
    }

    init();
  </script>
</body>
</html>
