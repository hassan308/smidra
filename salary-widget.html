<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smidra - Salary Statistics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Nordic Editorial Palette */
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;

      --cream: #FDFBF7;
      --cream-dark: #F5F1EA;
      --charcoal: #2C2C2C;
      --charcoal-light: #4A4A4A;
      --accent: #C85A38;
      --accent-light: #E8D5CE;
      --sage: #7B9E87;
      --sage-light: #E8F0EA;
      --warm-gray: #8B8680;
      --border: #E8E4DE;

      /* Light Theme */
      --bg-primary: var(--cream);
      --bg-secondary: var(--cream-dark);
      --bg-elevated: #FFFFFF;
      --text-primary: var(--charcoal);
      --text-secondary: var(--charcoal-light);
      --text-tertiary: var(--warm-gray);

      /* Shadows */
      --shadow-sm: 0 1px 2px rgba(44, 44, 44, 0.04);
      --shadow-md: 0 4px 12px rgba(44, 44, 44, 0.06);
      --shadow-lg: 0 8px 24px rgba(44, 44, 44, 0.08);

      /* Border Radius */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;
    }

    /* Dark mode uses same colors as light mode */
    [data-theme="dark"] {
      /* Same as light mode */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.025;
      pointer-events: none;
      z-index: 0;
    }

    .salary-card {
      position: relative;
      z-index: 1;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      max-width: 480px;
      box-shadow: var(--shadow-md);
    }

    /* Header */
    .salary-header {
      background: var(--charcoal);
      color: var(--cream);
      padding: 28px;
      position: relative;
    }

    /* Dark mode header same as light mode */

    .salary-eyebrow {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: 0.7;
      margin-bottom: 8px;
    }

    .salary-header-content {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .salary-icon {
      width: 52px;
      height: 52px;
      background: rgba(255,255,255,0.1);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }

    .salary-job-info { flex: 1; }

    .salary-job-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .salary-job-meta {
      font-size: 13px;
      opacity: 0.8;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .salary-main {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.15);
    }

    .salary-amount {
      font-family: var(--font-display);
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .salary-period {
      font-size: 16px;
      opacity: 0.7;
      margin-left: 6px;
    }

    /* Body */
    .salary-body { padding: 28px; }

    /* Range Section */
    .salary-range {
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
    }

    .salary-range-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 12px;
      color: var(--text-tertiary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .salary-range-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      position: relative;
      overflow: visible;
    }

    .salary-range-fill {
      position: absolute;
      height: 100%;
      background: linear-gradient(90deg, var(--sage) 0%, var(--accent) 100%);
      border-radius: 4px;
      left: 0;
      right: 0;
    }

    .salary-range-marker {
      position: absolute;
      top: 50%;
      width: 18px;
      height: 18px;
      background: var(--accent);
      border: 3px solid var(--bg-elevated);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: var(--shadow-md);
      z-index: 2;
    }

    .salary-range-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Comparison */
    .salary-comparison {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px;
      background: var(--sage-light);
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
      border: 1px solid rgba(123, 158, 135, 0.2);
    }

    .salary-comparison.negative {
      background: var(--accent-light);
      border-color: rgba(200, 90, 56, 0.2);
    }

    .comparison-icon {
      width: 44px;
      height: 44px;
      background: var(--sage);
      color: white;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .salary-comparison.negative .comparison-icon {
      background: var(--accent);
    }

    .comparison-text { flex: 1; }

    .comparison-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 16px;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .comparison-desc {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Details Grid */
    .salary-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .salary-detail-item {
      background: var(--bg-secondary);
      padding: 16px;
      border-radius: var(--radius-md);
      transition: transform 0.2s ease;
    }

    .salary-detail-item:hover {
      transform: translateY(-2px);
    }

    .salary-detail-icon {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .salary-detail-label {
      font-size: 11px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .salary-detail-value {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Tips Section */
    .salary-tips {
      padding: 18px;
      background: var(--accent-light);
      border-radius: var(--radius-lg);
      border-left: 3px solid var(--accent);
      margin-bottom: 20px;
    }

    .salary-tips-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
    }

    .salary-tips-list {
      font-size: 13px;
      color: var(--text-secondary);
      padding-left: 20px;
      margin: 0;
    }

    .salary-tips-list li {
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .salary-tips-list li:last-child { margin-bottom: 0; }

    /* Sources */
    .salary-sources {
      font-size: 12px;
      color: var(--text-tertiary);
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .salary-sources-title { font-weight: 600; }

    .source-tag {
      display: inline-flex;
      padding: 4px 10px;
      background: var(--bg-secondary);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* Actions */
    .salary-actions {
      display: flex;
      gap: 10px;
      padding: 20px;
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
    }

    .salary-action {
      flex: 1;
      padding: 12px 18px;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .salary-action.secondary {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .salary-action.secondary:hover {
      background: var(--cream-dark);
    }

    .salary-action.primary {
      background: var(--charcoal);
      color: var(--cream);
    }

    .salary-action.primary:hover {
      background: var(--charcoal-light);
    }

    /* Loading */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px;
      gap: 16px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* RTL Support */
    [dir="rtl"] .salary-header-content { flex-direction: row-reverse; }
    [dir="rtl"] .salary-range-labels { flex-direction: row-reverse; }
    [dir="rtl"] .salary-tips { border-left: none; border-right: 3px solid var(--accent); }
    [dir="rtl"] .salary-tips-list { padding-left: 0; padding-right: 20px; }
    [dir="rtl"] .salary-job-meta { flex-direction: row-reverse; }

    /* Responsive */
    @media (max-width: 480px) {
      body { padding: 12px; }
      .salary-header { padding: 20px; }
      .salary-amount { font-size: 36px; }
      .salary-details { grid-template-columns: 1fr; }
      .salary-actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const state = { data: null, language: 'sv', loadingText: 'Hämtar lönestatistik för tjänsten...' };

    const defaultLabels = {
      avgSalary: 'Genomsnittlig lon',
      perMonth: '/manad',
      salaryRange: 'Lonespann',
      min: 'Min',
      max: 'Max',
      entryLevel: 'Junior',
      senior: 'Senior',
      comparison: 'Jamforelse',
      aboveAvg: 'over genomsnittet',
      belowAvg: 'under genomsnittet',
      inRegion: 'i regionen',
      experience: 'Erfarenhet',
      industry: 'Bransch',
      demand: 'Efterfragan',
      sources: 'Kallor',
      tips: 'Tips for loneforhandling',
      backToJob: 'Tillbaka',
      negotiate: 'Forhandlingstips'
    };

    function t(key) {
      return state.data?.labels?.[key] || defaultLabels[key] || key;
    }

    function formatSalary(amount) {
      if (!amount) return '-';
      return new Intl.NumberFormat(state.language, {
        style: 'decimal',
        maximumFractionDigits: 0
      }).format(amount) + ' kr';
    }

    function notifyHeight() {
      setTimeout(() => {
        window.openai?.notifyIntrinsicHeight?.(document.body.scrollHeight);
      }, 100);
    }

    function render() {
      const app = document.getElementById('app');
      const d = state.data;

      if (!d) {
        app.innerHTML = `
          <div class="salary-card">
            <div class="loading-container">
              <div class="loading-spinner"></div>
              <div class="loading-text">${state.loadingText}</div>
            </div>
          </div>
        `;
        notifyHeight();
        return;
      }

      const job = d.job || {};
      const salary = d.salary || {};
      const comparison = d.comparison || {};
      const tips = d.tips || [];

      const range = (salary.max || 60000) - (salary.min || 30000);
      const avgPosition = range > 0 ? ((salary.avg || 45000) - (salary.min || 30000)) / range * 100 : 50;

      const isAbove = comparison.percentDiff > 0;
      const compIcon = isAbove ? '📈' : (comparison.percentDiff < 0 ? '📉' : '➡️');
      const compText = isAbove ? t('aboveAvg') : t('belowAvg');
      const compClass = isAbove ? '' : 'negative';

      app.innerHTML = `
        <div class="salary-card">
          <div class="salary-header">
            <div class="salary-eyebrow">Lonestatistik</div>
            <div class="salary-header-content">
              <div class="salary-icon">💰</div>
              <div class="salary-job-info">
                <div class="salary-job-title">${job.title || 'Tjanst'}</div>
                <div class="salary-job-meta">
                  ${job.employer ? `<span>🏢 ${job.employer}</span>` : ''}
                  ${job.location ? `<span>📍 ${job.location}</span>` : ''}
                </div>
              </div>
            </div>
            <div class="salary-main">
              <span class="salary-amount">${formatSalary(salary.avg)}</span>
              <span class="salary-period">${t('perMonth')}</span>
            </div>
          </div>

          <div class="salary-body">
            <div class="salary-range">
              <div class="salary-range-header">
                <span>${t('salaryRange')}</span>
                <span>${t('entryLevel')} → ${t('senior')}</span>
              </div>
              <div class="salary-range-bar">
                <div class="salary-range-fill"></div>
                <div class="salary-range-marker" style="left: ${avgPosition}%;"></div>
              </div>
              <div class="salary-range-labels">
                <span>${formatSalary(salary.min)}</span>
                <span>${formatSalary(salary.max)}</span>
              </div>
            </div>

            ${comparison.percentDiff !== undefined ? `
              <div class="salary-comparison ${compClass}">
                <div class="comparison-icon">${compIcon}</div>
                <div class="comparison-text">
                  <div class="comparison-title">${Math.abs(comparison.percentDiff)}% ${compText}</div>
                  <div class="comparison-desc">${comparison.description || t('inRegion')}</div>
                </div>
              </div>
            ` : ''}

            <div class="salary-details">
              ${salary.entryLevel ? `
                <div class="salary-detail-item">
                  <div class="salary-detail-icon">🌱</div>
                  <div class="salary-detail-label">${t('entryLevel')} (0-2 ar)</div>
                  <div class="salary-detail-value">${formatSalary(salary.entryLevel)}</div>
                </div>
              ` : ''}
              ${salary.experienced ? `
                <div class="salary-detail-item">
                  <div class="salary-detail-icon">⭐</div>
                  <div class="salary-detail-label">${t('senior')} (5+ ar)</div>
                  <div class="salary-detail-value">${formatSalary(salary.experienced)}</div>
                </div>
              ` : ''}
              ${d.industry ? `
                <div class="salary-detail-item">
                  <div class="salary-detail-icon">🏭</div>
                  <div class="salary-detail-label">${t('industry')}</div>
                  <div class="salary-detail-value">${d.industry}</div>
                </div>
              ` : ''}
              ${d.demandLevel ? `
                <div class="salary-detail-item">
                  <div class="salary-detail-icon">📊</div>
                  <div class="salary-detail-label">${t('demand')}</div>
                  <div class="salary-detail-value">${d.demandLevel}</div>
                </div>
              ` : ''}
            </div>

            ${tips.length > 0 ? `
              <div class="salary-tips">
                <div class="salary-tips-title">💡 ${t('tips')}</div>
                <ul class="salary-tips-list">
                  ${tips.map(tip => `<li>${tip}</li>`).join('')}
                </ul>
              </div>
            ` : ''}

            ${d.sources?.length > 0 ? `
              <div class="salary-sources">
                <span class="salary-sources-title">${t('sources')}:</span>
                ${d.sources.map(src => `<span class="source-tag">${src}</span>`).join('')}
              </div>
            ` : ''}
          </div>

          <div class="salary-actions">
            <button class="salary-action secondary" onclick="goBack()">
              ← ${t('backToJob')}
            </button>
            <button class="salary-action primary" onclick="askNegotiate()">
              💬 ${t('negotiate')}
            </button>
          </div>
        </div>
      `;

      notifyHeight();
    }

    function goBack() {
      if (window.openai?.requestClose) {
        window.openai.requestClose();
      }
    }

    function askNegotiate() {
      const job = state.data?.job || {};
      const salary = state.data?.salary || {};

      const message = `Ge mig tips for loneforhandling for tjansten "${job.title}" hos ${job.employer}.
Genomsnittslonen ar ${salary.avg} kr/man.
Hur kan jag argumentera for en hogre lon? Vilka fragor bor jag stalla?`;

      if (window.openai?.sendFollowUpMessage) {
        window.openai.sendFollowUpMessage({ prompt: message });
      }
    }

    function handleData(data) {
      if (!data) return;

      if (data.language) {
        state.language = data.language;
        document.documentElement.lang = data.language;
      }
      if (data.direction) {
        document.documentElement.dir = data.direction;
      }

      state.data = data;
      render();
    }

    function init() {
      if (window.openai?.theme) {
        document.documentElement.setAttribute('data-theme', window.openai.theme);
      }

      window.addEventListener('openai:set_globals', () => {
        if (window.openai?.theme) {
          document.documentElement.setAttribute('data-theme', window.openai.theme);
        }
        if (window.openai?.toolOutput) {
          handleData(window.openai.toolOutput);
        }
      });

      if (window.openai?.toolOutput) {
        handleData(window.openai.toolOutput);
      }
      // Always show loading until real data arrives - no demo data fallback
    }

    init();
  </script>
</body>
</html>
